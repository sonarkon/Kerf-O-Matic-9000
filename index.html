<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf-O-Matic 9000</title>
<style>
  :root {
    --bg: #f3f1ec; --panel: #ffffff; --text: #1d1b18; --muted: #6b665e;
    --line: #dcd7cd; --accent: #b4441c; --accent-ink: #fff; --board: #efe0c6;
    --cut: #c40000; --engrave: #1d1b18; --input: #faf9f6; --card: #f7f5f0;
    --ok: #2f7d32; --warn: #a66a00; --bad: #c0261b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #211f24; --text: #ece9e3; --muted: #9b968d;
      --line: #36333a; --accent: #e0703f; --accent-ink: #1a1009; --board: #3a3224;
      --cut: #ff5a4a; --engrave: #ece9e3; --input: #2a282e; --card: #29272d;
      --ok: #6cc070; --warn: #e3a83a; --bad: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; height: 100vh;
    grid-template-columns: 310px 1fr 280px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "header header header" "design view output";
  }
  header {
    grid-area: header; display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .seg { width: auto; flex-shrink: 0; }
  header .seg label { padding: 7px 14px; white-space: nowrap; }
  header .project {
    font: inherit; color: var(--text); background: var(--input);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; flex: 0 1 240px; min-width: 120px;
  }
  header .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  header .actions button { white-space: nowrap; }
  header #lang { width: auto; padding-right: 22px; }
  .savegroup { position: relative; display: flex; }
  .savegroup #saveBtn { border-radius: 6px 0 0 6px; min-width: 96px; }
  .savegroup .caret { border-radius: 0 6px 6px 0; border-left: 1px solid #ffffff55; padding: 8px 9px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 260px; padding: 4px;
    display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px #0003;
  }
  .menu button { border: 0; background: none; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; white-space: normal; }
  .menu button:hover, .menu button:focus-visible { background: var(--input); }
  .menu span { font-size: 12px; color: var(--muted); }
  .panel {
    background: var(--panel); padding: 12px 16px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .panel > * { flex-shrink: 0; }
  #design { grid-area: design; border-right: 1px solid var(--line); }
  #output { grid-area: output; border-left: 1px solid var(--line); gap: 14px; }
  main { grid-area: view; }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  h2, summary { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  details.sec { border-bottom: 1px solid var(--line); padding: 8px 0 12px; }
  details.sec:last-of-type { border-bottom: 0; }
  details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  details.sec > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .reset { margin-left: auto; padding: 0 6px; font-size: 13px; line-height: 1.5; color: var(--muted); background: none; border-color: transparent; text-transform: none; }
  details.sec > summary .reset:hover, details.sec > summary .reset:focus-visible { color: var(--text); border-color: var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .span2 { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .pnginfo { margin-top: 8px; }
  .pnginfo .tex { height: 84px; margin-top: 6px; border: 1px solid var(--line); border-radius: 4px; background-color: #fff; image-rendering: auto; }
  .cutprev { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .cutprev .cprow { display: flex; align-items: center; gap: 6px; width: 58%; }
  .cutprev input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .cutprev button { padding: 2px 7px; font-size: 11px; line-height: 1.4; }
  #cutCount { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  #stage.cutprev .cuts > * { stroke: var(--muted); stroke-opacity: .25; }
  #stage.cutprev .cuts > .done { stroke: var(--cut); stroke-opacity: 1; }
  #stage.cutprev .cuts > .now { stroke: var(--accent); stroke-opacity: 1; stroke-width: 3.5; }
  #stage.cutprev .boards { stroke-opacity: .25; }
  #stage.cutprev .boards.done { stroke: var(--cut); stroke-opacity: 1; }
  #stage.cutprev .boards.now { stroke: var(--accent); stroke-opacity: 1; stroke-width: 3; }
  #stage .travel { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; vector-effect: non-scaling-stroke; }
  label.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  label.inline > input, label.inline > select { width: 58%; flex: 0 0 58%; min-width: 0; }
  input[type=number], input[type=text], select {
    font: inherit; color: var(--text); background: var(--input);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
  }
  input:disabled, select:disabled { opacity: .55; }
  .checks { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg label { flex-direction: row; justify-content: center; padding: 7px; cursor: pointer; color: var(--text); font-size: 13px; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button {
    font: inherit; border-radius: 6px; padding: 8px 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--input); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.add { width: 100%; margin-top: 8px; padding: 6px; border-style: dashed; color: var(--muted); }
  h3.sub { font-size: 12px; font-weight: 600; margin: 14px 0 2px; color: var(--text); }
  #stage .marks { stroke: var(--engrave); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .card-head { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
  .card-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head button { padding: 1px 7px; font-size: 12px; line-height: 1.4; }
  .card-head { cursor: grab; touch-action: none; user-select: none; }
  .card-head button { cursor: pointer; }
  .card.collapsed .card-head { margin-bottom: 0; }
  .card.off .card-head span, .card.off .grid2 { opacity: .5; }
  .card-head .fold { flex: 0 0 auto; font-style: normal; color: var(--muted); width: 10px; }
  .card-head .onoff { display: flex; margin: 0; }
  .card-head .onoff input { width: auto; margin: 0 2px; }
  .card-head .grip { flex: 0 0 auto; font-style: normal; color: var(--muted); font-size: 14px; line-height: 1; }
  .card.dragging { position: fixed; z-index: 50; margin: 0; pointer-events: none; border-color: var(--accent);
    box-shadow: 0 14px 32px #0005; transform: rotate(-1.2deg) scale(1.03); transition: transform .12s, box-shadow .12s; }
  .card.dragging.settle { transform: none; box-shadow: 0 2px 6px #0002; transition: top .16s ease-out, transform .16s, box-shadow .16s; }
  .card-ph { margin-top: 8px; border: 2px dashed var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 8%, transparent); }
  body.card-drag, body.card-drag * { cursor: grabbing !important; user-select: none; }
  .card .grid2, .card .grid3 { gap: 6px; }
  /* slider with its value: drag or type */
  .card label.sl { flex-direction: row; align-items: center; gap: 6px; }
  .slrow .sllabel { flex: 0 0 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slrow input[type=range] { flex: 1; min-width: 0; padding: 0; accent-color: var(--accent); }
  .card .slrow input[type=number] { width: 58px; flex: 0 0 auto; padding: 3px 4px; }
  /* image modulator: fit buttons, placement preview, levels */
  .fitseg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .fitseg button { border: 0; border-radius: 0; padding: 4px 0; background: var(--input); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; }
  .fitseg button + button { border-left: 1px solid var(--line); }
  .fitseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .fitseg svg { width: 22px; height: 16px; }
  .placer { display: block; margin: 0 auto; border-radius: 4px; touch-action: none; cursor: grab; }
  .placer.fixed { cursor: default; }
  .placer.dragging { cursor: grabbing; }
  .levels canvas { display: block; width: 100%; height: 46px; touch-action: none; cursor: ew-resize; }
  .levels .lvnums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 3px; }
  .levels .lvnums label { font-size: 10px; }
  .levels .lvnums input { padding: 2px 4px; font-size: 12px; }
  .card input, .card select { padding: 4px 6px; font-size: 13px; }
  .card .imgrow { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .card .imgrow button { padding: 4px 8px; font-size: 12px; }
  .card .imgrow img { width: 56px; height: 56px; object-fit: contain; background: repeating-conic-gradient(#0001 0 25%, #0000 0 50%) 0 0 / 8px 8px; border-radius: 4px; border: 1px solid var(--line); }
  .info {
    font-size: 12px; line-height: 1.5; color: var(--muted);
    background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    word-break: break-word;
  }
  .info b { color: var(--text); font-weight: 600; }
  .info code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .info table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .info td { padding: 1px 4px 1px 0; }
  .info p { margin: 6px 0 0; }
  .info .fine { font-size: 11px; opacity: .8; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fixbtn { width: 100%; margin-top: 8px; }
  .stats div { display: flex; flex-direction: column; }
  .stats span { font-size: 11px; }
  .stats strong { font-size: 20px; line-height: 1.2; color: var(--text); font-variant-numeric: tabular-nums; }
  .stats strong.ok, .stats em.ok { color: var(--ok); }
  .stats strong.warn, .stats em.warn { color: var(--warn); }
  .stats strong.bad, .stats em.bad { color: var(--bad); }
  .stats em { font-style: normal; font-size: 11px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .credit { margin-top: auto; padding-top: 12px; font-size: 11px; color: var(--muted); }
  a { color: var(--accent); }
  .credit a { color: inherit; }
  main { position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  main.dragging { cursor: grabbing; }
  main.dark { background: #0f0d0c; }
  #stage { position: absolute; left: 0; top: 0; }
  #stage svg { display: block; overflow: visible; }
  #stage svg .cuts *, #stage svg .boards * { vector-effect: non-scaling-stroke; }
  /* one bar across the preview: 2D/3D on the left, bend + overlays on the right; wraps when narrow */
  .topbar { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; display: flex; flex-wrap: wrap;
            justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .viewbar { display: flex; gap: 8px; }
  .viewseg { width: 130px; }
  .viewseg label { padding: 5px; font-size: 12px; }
  .pill {
    flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
  }
  .pill input[type=range] { width: 140px; accent-color: var(--accent); }
  .pill output { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .toggles { display: flex; gap: 6px; margin-left: auto; }
  .iconbtn {
    position: relative; width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center; cursor: pointer; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .iconbtn input { position: absolute; opacity: 0; width: 0; height: 0; }
  .iconbtn:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .iconbtn.lamp:has(input:checked) { color: #2b1a00; background: #ffc35a; border-color: #ffc35a; box-shadow: 0 0 14px #ffb04a99; }
  .iconbtn.lamp:has(input:checked) svg { fill: #fff3d0; }
  .iconbtn.flex:has(input:checked) { color: #fff; background: linear-gradient(135deg, #3e9b4f, #e0a526 55%, #d6332a); border-color: transparent; }
  #three { position: absolute; inset: 0; }
  #three canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .threemsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  .zoom {
    position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
  }
  .zoom button { padding: 4px 10px; }
  .zoom span { min-width: 48px; text-align: center; font-size: 12px; color: var(--muted); }
  .hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 1100px) {
    body {
      grid-template-columns: 310px 1fr; grid-template-rows: auto 1fr auto;
      grid-template-areas: "header header" "design view" "output output";
      height: auto; min-height: 100vh;
    }
    header { flex-wrap: wrap; }
    main { min-height: 70vh; }
    #design { max-height: calc(70vh + 60px); }
    #output { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  @media (max-width: 720px) {
    body {
      grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto;
      grid-template-areas: "header" "design" "view" "output";
    }
    header { gap: 10px; }
    header .seg { width: 100%; order: 3; }
    header .project { width: 100%; order: 2; }
    #design { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
    main { min-height: 0; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <input type="text" id="project" class="project" maxlength="80" data-i18n-placeholder="project.ph" data-i18n-aria="project">
  <div class="seg" role="radiogroup" data-i18n-aria="mode.aria">
    <label><input type="radio" name="mode" value="pattern" checked> <span data-i18n="mode.pattern"></span></label>
    <label><input type="radio" name="mode" value="creative"> <span data-i18n="mode.creative"></span></label>
    <label><input type="radio" name="mode" value="test"> <span data-i18n="mode.test"></span></label>
    <label><input type="radio" name="mode" value="mount"> <span data-i18n="mode.mount"></span></label>
  </div>
  <div class="actions">
    <select id="lang" aria-label="Language / Sprache">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
    <button id="loadBtn" data-i18n="load"></button>
    <div class="savegroup">
      <button class="primary" id="saveBtn"></button>
      <button class="primary caret" id="saveMenuBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="save.more">▾</button>
      <div class="menu" id="saveMenu" role="menu" hidden>
        <button role="menuitem" data-fmt="svg"><b data-i18n="fmt.svg"></b><span data-i18n="fmt.svg.d"></span></button>
        <button role="menuitem" data-fmt="stl"><b data-i18n="fmt.stl"></b><span class="bendDesc"></span></button>
        <button role="menuitem" data-fmt="obj"><b data-i18n="fmt.obj"></b><span class="bendDesc"></span></button>
        <button role="menuitem" data-fmt="png"><b data-i18n="fmt.png"></b><span data-i18n="fmt.png.d"></span></button>
      </div>
    </div>
  </div>
  <input type="file" id="loadFile" accept=".svg,.png,.obj,.stl,image/svg+xml,image/png" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</header>

<aside id="design" class="panel">
  <details class="sec" open>
    <summary><span data-i18n="sec.board" data-modes="pattern creative mount"></span><span data-i18n="material" data-modes="test"></span></summary>
    <div class="grid2">
      <label data-modes="pattern creative mount"><span data-i18n="boardW"></span><input type="number" id="boardW" value="150" min="1" step="0.5"></label>
      <label data-modes="pattern creative mount"><span data-i18n="boardH"></span><input type="number" id="boardH" value="100" min="1" step="0.5"></label>
      <label><span data-i18n="thick"></span><input type="number" id="thick" value="3" min="0.1" step="0.1"></label>
      <label><span data-i18n="material"></span><select id="material"></select></label>
      <label data-modes="pattern creative mount"><span data-i18n="diameter"></span><input type="number" id="diameter" min="0.1" step="0.5"></label>
      <label data-modes="pattern creative mount"><span data-i18n="diaRef"></span><select id="diaRef">
        <option value="inner" data-i18n="ref.inner"></option>
        <option value="mid" data-i18n="ref.mid"></option>
        <option value="outer" data-i18n="ref.outer"></option>
      </select></label>
    </div>
    <div class="desc" id="diaSummary" data-modes="pattern creative mount"></div>
    <div class="grid2" style="margin-top:8px">
      <label class="span2" id="matNameRow"><span data-i18n="mat.name"></span><input type="text" id="matName" maxlength="40" data-nomain></label>
      <label><span data-i18n="mat.ok"></span><input type="number" id="matOk" min="0.05" step="0.05" data-nomain></label>
      <label><span data-i18n="mat.max"></span><input type="number" id="matMax" min="0.05" step="0.05" data-nomain></label>
    </div>
    <div class="desc"><span id="matHint"></span> <a href="#" id="matDup" data-i18n="mat.dup"></a> <a href="#" id="matDel" data-i18n="mat.del"></a></div>
    <div class="checks" data-modes="pattern creative">
      <label class="check"><input type="checkbox" id="seamless"> <span data-i18n="seamless"></span></label>
    </div>
    <div class="grid2" data-modes="pattern creative" style="margin-top:8px">
      <label><span data-i18n="joint"></span><select id="joint">
        <option value="none" data-i18n="joint.none"></option>
        <option value="tab" data-i18n="joint.tab"></option>
        <option value="fingers" data-i18n="joint.fingers"></option>
        <option value="pattern" data-i18n="joint.pattern"></option>
      </select></label>
      <label><span data-i18n="jointSize"></span><input type="number" id="jointSize" value="10" min="1" step="0.5"></label>
    </div>
    <div class="desc" id="jointDesc" data-modes="pattern creative"></div>
  </details>

  <details class="sec" open data-modes="pattern creative test">
    <summary><span data-i18n="sec.shape"></span></summary>
    <select id="shape"></select>
    <div class="desc" id="shapeDesc"></div>
    <div class="desc warn" id="meanderNote" hidden data-i18n="cr.meanderNote"></div>
  </details>

  <details class="sec" open data-modes="pattern creative test">
    <summary><span data-i18n="sec.slot"></span></summary>
    <div class="grid2">
      <label><span data-i18n="slotH"></span><input type="number" id="slotH" value="20" min="0.1" step="0.5"></label>
      <label><span data-i18n="slotW"></span><input type="number" id="slotW" value="2" min="0" step="0.1"></label>
      <label><span data-i18n="gapY"></span><input type="number" id="gapY" value="4" min="0.1" step="0.1"></label>
      <label><span data-i18n="gapX"></span><input type="number" id="gapX" value="2" min="0.1" step="0.1"></label>
      <label><span data-i18n="offsetMode"></span><select id="offsetMode">
        <option value="top" data-i18n="off.top"></option>
        <option value="center" selected data-i18n="off.center"></option>
        <option value="custom" data-i18n="off.custom"></option>
      </select></label>
      <label><span data-i18n="offset"></span><input type="number" id="offset" value="0" step="0.5"></label>

// ---------------------------------------------------------------- shapes
// Each shape returns SVG element strings for a slot centred at (cx, cy)
// with half-width hw and half-height hh (all in mm).
const NECK_RATIO = 0.4;  // dogbone neck / S-slot width as a fraction of the slot width
const SHAPES = {
  Pill: {
    draw(cx, cy, hw, hh) {
      if (hw <= 0) return [`<line x1="${f(cx)}" y1="${f(cy - hh)}" x2="${f(cx)}" y2="${f(cy + hh)}"/>`];
      if (hh >= hw) {
        const r = hw, d = hh - hw;
        return [`<path d="M${f(cx - r)},${f(cy - d)} V${f(cy + d)} A${f(r)},${f(r)} 0 0 0 ${f(cx + r)},${f(cy + d)} V${f(cy - d)} A${f(r)},${f(r)} 0 0 0 ${f(cx - r)},${f(cy - d)} Z"/>`];
      }
      const r = hh, d = hw - hh;
      return [`<path d="M${f(cx - d)},${f(cy - r)} H${f(cx + d)} A${f(r)},${f(r)} 0 0 1 ${f(cx + d)},${f(cy + r)} H${f(cx - d)} A${f(r)},${f(r)} 0 0 1 ${f(cx - d)},${f(cy - r)} Z"/>`];
    }
  },
  Line: {
    line: true,
    draw: (cx, y1, y2) => [`<line x1="${f(cx)}" y1="${f(y1)}" x2="${f(cx)}" y2="${f(y2)}"/>`]
  },
  Meander: {
    meander: true
  },
  Ellipse: {
    draw: (cx, cy, hw, hh) => [`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(hw)}" ry="${f(hh)}"/>`]
  },
  Rectangle: {
    draw(cx, cy, hw, hh) {
      const r = Math.min(hw, hh) * 0.3;
      return [`<rect x="${f(cx - hw)}" y="${f(cy - hh)}" width="${f(hw * 2)}" height="${f(hh * 2)}" rx="${f(r)}"/>`];
    }
  },
  Diamond: {
    draw: (cx, cy, hw, hh) => [`<polygon points="${[[cx, cy - hh], [cx + hw, cy], [cx, cy + hh], [cx - hw, cy]].map(p => p.map(f).join(',')).join(' ')}"/>`]
  },
  Bone: {
    // Dogbone: narrow neck with round relief holes at both ends (hole Ø = slot width).
    draw(cx, cy, hw, hh) {
      const R = hw, n = hw * NECK_RATIO, s = Math.sqrt(R * R - n * n);
      const yt = cy - hh + R, yb = cy + hh - R;
      if (hw <= 0 || yb - s < yt + s) return SHAPES.Pill.draw(cx, cy, hw, hh);
      const A = `A${f(R)},${f(R)} 0 1 1`;
      return [`<path d="M${f(cx + n)},${f(yt + s)} V${f(yb - s)} ${A} ${f(cx - n)},${f(yb - s)} V${f(yt + s)} ${A} ${f(cx + n)},${f(yt + s)} Z"/>`];
    }
  },
  Hexagon: {
    draw: (cx, cy, hw, hh) => [`<polygon points="${[[cx, cy - hh], [cx + hw, cy - hh / 2], [cx + hw, cy + hh / 2], [cx, cy + hh], [cx - hw, cy + hh / 2], [cx - hw, cy - hh / 2]].map(p => p.map(f).join(',')).join(' ')}"/>`]
  },
  Chevron: {
    draw: (cx, cy, hw, hh) => [`<polyline points="${f(cx - hw)},${f(cy - hh)} ${f(cx)},${f(cy + hh)} ${f(cx + hw)},${f(cy - hh)}"/>`]
  },
  Wave: {
    // S-slot of constant width w with round ends. The centre line is two
    // tangent-continuous arcs (radius R) that start and end vertical; both
    // outline sides are concentric arcs, so the path stays exact.
    draw(cx, cy, hw, hh) {
      const w = 2 * hw * NECK_RATIO, a = hw - w / 2, h = hh - w / 2;
      if (a <= 1e-6 || h <= 1e-6) return SHAPES.Pill.draw(cx, cy, hw, hh);
      const R = (a * a + h * h) / (2 * a), q = w / 2;
      if (R - q <= 1e-6) return SHAPES.Pill.draw(cx, cy, hw, hh);
      const C1 = [cx - a + R, cy - h], C2 = [cx + a - R, cy + h];   // arc centres
      const nx = (R - a) / R, ny = -h / R;                             // unit normal at the middle, towards C1
      const pE1 = [cx - a + q, cy - h], mE1 = [cx - a - q, cy - h];   // ends, + / − side
      const pE2 = [cx + a + q, cy + h], mE2 = [cx + a - q, cy + h];
      const pM = [cx + q * nx, cy + q * ny], mM = [cx - q * nx, cy - q * ny];
      const arc = (from, to, c, r) => {
        const cross = (from[0] - c[0]) * (to[1] - c[1]) - (from[1] - c[1]) * (to[0] - c[0]);
        return `A${f(r)},${f(r)} 0 0 ${cross > 0 ? 1 : 0} ${f(to[0])},${f(to[1])}`;
      };
      const cap = to => `A${f(q)},${f(q)} 0 0 1 ${f(to[0])},${f(to[1])}`;
      return [`<path d="M${f(pE1[0])},${f(pE1[1])} ${arc(pE1, pM, C1, R - q)} ${arc(pM, pE2, C2, R + q)} ${cap(mE2)} ` +
              `${arc(mE2, mM, C2, R - q)} ${arc(mM, mE1, C1, R + q)} ${cap(pE1)} Z"/>`];
    }
  },
  Cross: {
    draw(cx, cy, hw, hh) {
      const aw = hw * 0.3, ah = hh * 0.3;
      return [
        `<rect x="${f(cx - aw)}" y="${f(cy - hh)}" width="${f(aw * 2)}" height="${f(hh * 2)}"/>`,
        `<rect x="${f(cx - hw)}" y="${f(cy - ah)}" width="${f(hw * 2)}" height="${f(ah * 2)}"/>`
      ];
    }
  }
};

// Allowed tensile strain ε (%) for the flex estimate: "ok" = permanent bend

const NUM = ['boardW', 'boardH', 'thick', 'slotH', 'slotW', 'gapY', 'gapX', 'offset', 'kerf', 'jointSize', 'diffW', 'diffGap', 'diffOverlap',
             'socketHole', 'ringW', 'spokes', 'spokeW', 'hubW', 'mountClear', 'tabCount', 'tabW', 'rim',
             'marginX', 'testFrom', 'testTo', 'testCount', 'testW', 'testH'];

const CHK = ['seamless', 'openEdges', 'border', 'rotate', 'paramVisible', 'lampTabs', 'mountMarks', 'diffuser', 'diffCut'];
const MODES = ['pattern', 'creative', 'mount', 'test'];
// the cylinder the mount mode builds parts for comes from the last Simple/Creative design
let shellMode = 'pattern';

function readParams() {
  const p = { mode: document.querySelector('input[name=mode]:checked').value };
  for (const k of NUM) p[k] = parseFloat($(k).value) || 0;
  for (const k of SEL) p[k] = $(k).value;
  for (const k of CHK) p[k] = $(k).checked;
  p.project = $('project').value.trim();
  p.shellMode = shellMode;
  if (customMaterials[p.material]) p.materialDef = { ...customMaterials[p.material] };
  p.spokes = clamp(Math.round(p.spokes), 2, 8);
  p.testCount = clamp(Math.round(p.testCount), 1, 30);
  p.creative = JSON.parse(JSON.stringify(creative));
  p.mountParts = JSON.parse(JSON.stringify(lampParts));
  return p;
}
function writeParams(p) {
  p = migrate(p);
  // a design with its own material brings the definition along
  if (p.materialDef && p.material && !MATERIALS[p.material]) { customMaterials[p.material] = { ...p.materialDef }; saveMaterials(); fillMaterials(); }
  if (MODES.includes(p.mode)) document.querySelector(`input[name=mode][value="${p.mode}"]`).checked = true;
  for (const k of NUM) if (p[k] != null) $(k).value = p[k];
  for (const k of SEL) if (p[k] != null && [...$(k).options].some(o => o.value === p[k])) $(k).value = p[k];
  for (const k of CHK) if (p[k] != null) $(k).checked = !!p[k];
  if (p.project != null) $('project').value = p.project;
  if (p.shellMode === 'pattern' || p.shellMode === 'creative') shellMode = p.shellMode;
  if (p.creative) creative = { bands: p.creative.bands || [], mods: (p.creative.mods || []).map(m => ({ ...newMod(p), ...m })) };
  // parts list; older designs had one top and one bottom part
  if (Array.isArray(p.mountParts)) lampParts = p.mountParts.map(q => ({ ...newPart(q.from === 'bottom' ? 'bottom' : 'top'), ...q }));
  // in between, the attachment at the ends was one setting for both: hand it to the end parts
  if (Array.isArray(p.mountParts) && ['tabs', 'edge'].includes(p.mountFix))
    for (const q of lampParts) if (!(q.offset > 0) && (!q.fix || q.fix === 'glue')) q.fix = p.mountFix;
  else if (p.mountTop || p.mountBottom) lampParts = [['top', p.mountTop], ['bottom', p.mountBottom]]
    .filter(([, k]) => k && k !== 'none').map(([from, kind]) => ({ ...newPart(from), kind, fix: p.mountFix || 'glue' }));

}
// Files from before creative mode had a left→right gradient in pattern mode.
// It becomes a linear modulator (the column grid stays fixed, so a changing
// horizontal gap is expressed as a changing slot width).
function migrate(p) {
  // PETG was a built-in material earlier (it does not laser-cut well): such designs load as acrylic
  if (p.material === 'petg') p = { ...p, material: 'pmma' };
  if (!p.gradParam || p.gradParam === 'off' || p.creative) return p;
  const m = { ...newMod(p), source: 'linear', angle: 0, mirror: p.gradProfile === 'center' };
  if (p.gradParam === 'slotH') Object.assign(m, { target: 'slotH', from: p.slotH, to: p.gradEnd });
  else Object.assign(m, { target: 'slotW', from: p.slotW, to: +(p.slotW + p.gapX - p.gradEnd).toFixed(3) });
  return { ...p, mode: 'creative', creative: { bands: [], mods: [m] } };
}

// Vertical shift of the slot grid (mm). "center" makes top and bottom edges
// mirror images: both column types together repeat every stepY/2, so the
// shift is half of whatever is left over after whole pitches.
function effectiveOffset(p, h) {
  if (p.offsetMode === 'custom') return p.offset;
  if (p.offsetMode === 'center') {
    const stepY = p.slotH + p.gapY;
    return stepY > 0 ? +((h % stepY) / 2).toFixed(3) : 0;
  }
  return 0;
}

// Width is the circumference on the material's mid-plane (neutral axis).
const midDiameter = p => p.boardW / Math.PI;
// The Bend slider sets how far the board is bent: 100 % = closed cylinder,
// 50 % = half the curvature (twice the radius), 0 % = flat. Strain scales with
// the curvature, so the analysis uses this effective mid-plane diameter.
const bendFactor = () => (typeof view3d === 'object' ? view3d.bend : 100) / 100;
const bendDiameter = p => { const b = bendFactor(); return b > 0 ? midDiameter(p) / b : Infinity; };
function syncDiameter() {
  const w = parseFloat($('boardW').value), th = parseFloat($('thick').value) || 0;
  if (!(w > 0)) return;
  const dm = w / Math.PI, ref = $('diaRef').value;
  $('diameter').value = +(ref === 'inner' ? dm - th : ref === 'outer' ? dm + th : dm).toFixed(2);
}
function diameterChanged() {
  const d = parseFloat($('diameter').value), th = parseFloat($('thick').value) || 0, ref = $('diaRef').value;

    image: () => !m.img ? '–' : [m.img.name, t('fit.' + (m.fit || 'stretch')) + ((m.fit || 'stretch') === 'stretch' ? '' : ` ${fmt(m.imgScale ?? 100)} % @ ${fmt(m.posX ?? 50)}/${fmt(m.posY ?? 50)}`),
      `${t('mod.levels')} ${fmt(m.black || 0)}–${fmt(m.white ?? 100)} %, γ ${fmt(m.gamma || 1)}`, m.blur ? `${t('mod.blur')} ${fmt(m.blur)}` : ''].filter(Boolean).join(', ')
  }[m.source]();
  const tgt = m.target === 'skip' ? `> ${fmt(m.threshold)} %`
    : m.target === 'shape' ? `→ ${shapeName(m.shapeB)} > ${fmt(m.threshold)} %`
    : `${fmt(m.from)} → ${fmt(m.to)} mm, ${fmt(m.strength)} %`;
  return `${t('tg.' + m.target)} ← ${t('src.' + m.source)} (${src})${m.invert ? ' inv' : ''}: ${tgt}`;
}

function paramLines(p, doc, bendPct = view3d.bend) {
  if (p.mode === 'mount') {
    const g = doc.mount.g, L = [];
    if (p.project) L.push(t('pl.project', p.project));
    L.push(t('pl.mode', t('mode.mount')));
    L.push(t('pl.mountCyl', fmt(+g.di.toFixed(2)), fmt(p.thick), matOf(p).name));
    for (const prt of doc.mount.parts) L.push(t('pl.mountPart', `${prt.n} ${t('mt.from.' + prt.pos)}${prt.offset ? ` +${fmt(prt.offset)} mm` : ''}`,
      `${t('mt.' + prt.kind)} (${t('mt.pf.' + prt.fix)})`, fmt(+(2 * prt.ro).toFixed(2))));
    L.push(t('pl.mountDims', fmt(p.socketHole), fmt(p.ringW), p.spokes, fmt(p.spokeW), fmt(p.hubW), fmt(p.mountClear)));
    const dp = doc.mount.diffuser;
    if (dp && dp.ok) L.push(t('pl.diff', fmt(p.diffW), fmt(p.diffGap), dp.sections.map(sct => `${fmt(+sct.w.toFixed(1))} × ${fmt(+sct.h.toFixed(1))}`).join(', ')));
    if (doc.mount.parts.some(q => q.fix === 'tabs' || q.fix === 'through')) L.push(t('pl.tabs', clamp(Math.round(p.tabCount), 2, 24), fmt(p.tabW), fmt(p.thick)));
    if (p.kerf) L.push(t('pl.kerf', fmt(p.kerf)));
    // the shade's own parameters (its mode line first), without its footer
    L.push(...paramLines({ ...shellOf(p), project: '' }, doc.shell, 100).slice(0, -1));
    L.push(t('pl.footer', doc.count, new Date().toISOString().slice(0, 16).replace('T', ' ')));
    return L;
  }
  const dm = midDiameter(p), th = p.thick;
  const L = [];
  if (p.project) L.push(t('pl.project', p.project));
  L.push(t('pl.mode', t('mode.' + p.mode)));
  if (p.mode === 'test') {
    L.push(t('pl.test', t('p.' + p.testParam), fmt(p.testFrom), fmt(p.testTo), p.testCount));
    L.push(t('pl.strip', fmt(p.testW), fmt(p.testH), labelZone(p)));
  } else {
    L.push(t('pl.board', fmt(p.boardW), fmt(p.boardH)));
    L.push(t('pl.dia', (dm - th).toFixed(2), dm.toFixed(2), (dm + th).toFixed(2)));
  }
  L.push(t('pl.material', matOf(p).name, fmt(th)) + ` (ε ${matOf(p).ok}/${matOf(p).max} %)`);
  L.push(t('pl.shape', shapeName(p.shape)));
  L.push(t('pl.slot', fmt(p.slotW), fmt(p.slotH)));
  const seam = p.mode !== 'test' && doc.gen?.seamGap != null;
  L.push(t('pl.gaps', fmt(p.gapY), seam ? t('pl.seamGap', fmt(+doc.gen.seamGap.toFixed(3)), fmt(p.gapX)) : `${fmt(p.gapX)} mm`));
  const offH = p.mode === 'test' ? p.testH : p.boardH;
  L.push(t('pl.offset', t('off.' + p.offsetMode), fmt(effectiveOffset(p, offH))));
  if (p.mode !== 'test') L.push(t('pl.seamless', p.seamless, doc.gen?.cols.length ?? 0));
  if (p.mode === 'creative') {
    const c = p.creative;
    c.bands.forEach((b, i) => L.push(t('pl.band', i + 1, shapeName(b.shape),
      i === c.bands.length - 1 ? t('band.rest') : `${fmt(+b.height || 0)} mm`,
      b.slotW == null || b.slotW === '' ? fmt(p.slotW) : fmt(+b.slotW),
      b.slotH == null || b.slotH === '' ? fmt(p.slotH) : fmt(+b.slotH))));
    c.mods.forEach((m, i) => L.push(t('pl.mod', i + 1, modText(m)) + (m.off ? ' ' + t('mod.offTag') : '')));
  }
  L.push(t('pl.rotated', p.rotate));
  L.push(t('pl.edges', fmt(p.marginX), p.openEdges, p.mode === 'test' || p.border));
  if (p.mode !== 'test' && p.joint && p.joint !== 'none') L.push(t('pl.joint', t('joint.' + p.joint), p.joint === 'pattern' ? '' : `, ${fmt(p.jointSize)} mm`));
  if (tabHeight(p)) L.push(t('pl.tabs', clamp(Math.round(p.tabCount), 2, 24), fmt(p.tabW), fmt(p.thick)));
  if (p.kerf) L.push(t('pl.kerf', fmt(p.kerf)));
  L.push(t('pl.order', t('ord.' + p.order)));
  if (p.mode !== 'test') {
    const fs = flexSummary(p, doc, bendPct);
    if (fs.eps != null) L.push(t('pl.flex', fs.eps.toFixed(2), fs.status[1], Math.round(fs.dMinInner), bendPct));
  }
  L.push(t('pl.footer', doc.count, new Date().toISOString().slice(0, 16).replace('T', ' ')));
  return L;
}

// File-name safe project slug: transliterate umlauts, keep [a-z0-9-].
function slug(s) {
  return s.toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}
// own materials appear in file names by their (slugged) name
const matTag = p => customMaterials[p.material] ? slug(customMaterials[p.material].name) || 'material' : p.material;
function fileName(p, doc) {
  if (p.mode === 'mount') {
    const proj = slug(p.project || ''), g = doc.mount.g;
    const parts = ['kerflamp', matTag(p), `D${fmt(+g.di.toFixed(1))}x${fmt(p.thick)}mm`,
      ...doc.mount.parts.map(q => `${q.pos[0]}${q.offset ? fmt(q.offset) : ''}-${q.kind}${q.fix === 'glue' ? '' : '-' + q.fix}`), `hole${fmt(p.socketHole)}`];
    if (doc.mount.parts.some(q => q.fix === 'tabs' || q.fix === 'through')) parts.push(`tabs${clamp(Math.round(p.tabCount), 2, 24)}x${fmt(p.tabW)}`);
    if (doc.mount.parts.some(q => q.fix === 'edge')) parts.push('edge');
    if (p.diffuser) parts.push(`diff${fmt(p.diffW)}`);
    if (p.kerf) parts.push(`kerf${fmt(p.kerf)}`);
    if (proj) parts.unshift(proj);
    return parts.join('_') + '.svg';
  }
  const parts = [p.mode === 'test' ? 'kerftest' : 'kerf', p.shape.toLowerCase(), matTag(p)];
  const proj = slug(p.project || '');
  if (proj) parts.unshift(proj);
  if (p.mode === 'test') {
    parts.push(p.testCount === 1 ? `${TEST_FILE[p.testParam]}${fmt(p.testFrom)}` : `${TEST_FILE[p.testParam]}${fmt(p.testFrom)}-${fmt(p.testTo)}x${p.testCount}`, `${fmt(p.testW)}x${fmt(p.testH)}x${fmt(p.thick)}mm`);
  } else {
    parts.push(`${fmt(p.boardW)}x${fmt(p.boardH)}x${fmt(p.thick)}mm`);
  }
  const gx = p.mode !== 'test' && doc.gen?.seamGap != null ? +doc.gen.seamGap.toFixed(3) : p.gapX;
  parts.push(`slot${fmt(p.slotW)}x${fmt(p.slotH)}`, `gapV${fmt(p.gapY)}`, `gapH${fmt(gx)}`);
  const off = effectiveOffset(p, p.mode === 'test' ? p.testH : p.boardH);
  if (off) parts.push(`ofs${fmt(off)}`);
  if (p.marginX) parts.push(`m${fmt(p.marginX)}`);
  if (p.mode !== 'test' && p.joint && p.joint !== 'none') parts.push(`${p.joint}${fmt(p.jointSize)}`);
  if (tabHeight(p)) parts.push(`tabs${clamp(Math.round(p.tabCount), 2, 24)}x${fmt(p.tabW)}`);
  if (p.kerf) parts.push(`kerf${fmt(p.kerf)}`);
  if (p.mode === 'creative') parts.push(`creative-b${p.creative.bands.length}m${p.creative.mods.length}`);
  if (p.mode !== 'test' && p.seamless) parts.push('seamless');
  if (p.openEdges) parts.push('open');
  if (p.mode !== 'test' && p.border) parts.push('border');
  if (p.rotate) parts.push('rot90');
  return parts.join('_') + '.svg';
}

// The parameter record stored in every export that can be loaded again (SVG, OBJ, PNG).
function paramsJSON(p) {
  const { paramVisible, ...meta } = p;
  if (meta.mode !== 'creative') delete meta.creative;
  return JSON.stringify({ generator: 'kerf-generator', unit: 'mm', ...meta });
}

// Rotation by 90° clockwise: (x, y) → (H − y, x)
// Mount tabs (doc.padY) stick out above and below the board: shift everything
// down by padY and enlarge the drawing so nothing ends up outside the page.
const rotTransform = doc => {
  const pad = doc.padY || 0, H = doc.h + 2 * pad;
  const shift = pad ? ` translate(0,${f(pad)})` : '';
  return doc.rotate ? ` transform="matrix(0,1,-1,0,${f(H)},0)${shift}"` : shift ? ` transform="${shift.trim()}"` : '';
};
const outerSize = doc => { const H = doc.h + 2 * (doc.padY || 0); return doc.rotate ? [H, doc.w] : [doc.w, H]; };

// Export document: separate Inkscape-compatible layers for cuts, border,
// engraving and parameters. The parameter block sits below the work area.
function buildSVG(p, doc) {
  const [W, H] = outerSize(doc);
  const lines = paramLines(p, doc);
  const fs = 3.5, lh = fs * 1.4, pad = 5;
  const totalH = H + pad + lines.length * lh + 2;

  const tr = rotTransform(doc), paramVisible = p.paramVisible;
  const out = [];
  out.push('<?xml version="1.0" encoding="UTF-8"?>');
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="${f(W)}mm" height="${f(totalH)}mm" viewBox="0 0 ${f(W)} ${f(totalH)}">`);
  out.push(`  <title>${esc(p.project || fileName(p, doc))}</title>`);
  out.push(`  <desc>${esc(lines.join(' | '))}</desc>`);
  out.push(`  <metadata id="kerf-params">${esc(paramsJSON(p))}</metadata>`);
  // laser order: engrave first, then the inner cuts, the outer contour last (the part stays in place until then)
  if (doc.labels.length) {
    out.push(`  <g id="engrave" inkscape:groupmode="layer" inkscape:label="${t('layer.engrave')}" fill="#000000" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="3"${tr}>`);
    for (const l of doc.labels) out.push('    ' + l);
    out.push('  </g>');
  }
  out.push(`  <g id="cuts" inkscape:groupmode="layer" inkscape:label="${t('layer.cuts')}" stroke="#ff0000" stroke-width="0.1" fill="none"${tr}>`);
  for (const c of doc.cuts) out.push('    ' + c);
  out.push('  </g>');
  if (doc.borders.length) {
    out.push(`  <g id="border" inkscape:groupmode="layer" inkscape:label="${t('layer.border')}" stroke="#ff0000" stroke-width="0.1" fill="none"${tr}>`);
    for (const b of doc.borders) out.push('    ' + b);
    out.push('  </g>');
  }
  // after the outer cut: the flipped parts' back-side grooves, then the diffuser sheets (paper: separate job)
  if (doc.back?.length) {
    out.push(`  <g id="engrave-back" inkscape:groupmode="layer" inkscape:label="${t('layer.back')}" fill="#555555" stroke="none"${tr}>`);
    for (const b of doc.back) out.push('    ' + b);
    out.push('  </g>');
  }
  if (doc.diff?.length) {
    out.push(`  <g id="diffuser" inkscape:groupmode="layer" inkscape:label="${t('layer.diff')}" stroke="#00a651" stroke-width="0.1" fill="none" color="#00a651"${tr}>`);
    for (const b of doc.diff) out.push('    ' + b);
    out.push('  </g>');
  }
  out.push(`  <g id="parameter" inkscape:groupmode="layer" inkscape:label="${t('layer.params')}" fill="#0000ff" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="${fs}"${paramVisible ? '' : ' style="display:none"'}>`);
  lines.forEach((txt, i) => out.push(`    <text x="0" y="${f(H + pad + fs + i * lh)}">${esc(txt)}</text>`));
  out.push('  </g>');
  out.push('</svg>');
  return out.join('\n');
}

// ---------------------------------------------------------------- creative UI
const opt = (v, label, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
const numField = (list, i, key, label, val, extra = '') =>
  `<label>${esc(label)}<input type="number" data-list="${list}" data-i="${i}" data-k="${key}" value="${val ?? ''}" ${extra}></label>`;
// a slider with its value next to it (both edit the same field)
const sliderField = (list, i, key, label, val, min, max, step) => {
  const a = `data-list="${list}" data-i="${i}" data-k="${key}"`;
  return `<label class="sl slrow"><span class="sllabel">${esc(label)}</span><input type="range" ${a} min="${min}" max="${max}" step="${step}" value="${val ?? ''}">` +
    `<input type="number" ${a} step="${step}" value="${val ?? ''}"></label>`;
};
const cardHead = (list, i, n, title, item) =>
  `<div class="card-head" data-list="${list}" data-i="${i}" title="${esc(t('btn.drag'))}"><i class="grip" aria-hidden="true">⠿</i>` +
  `<i class="fold" aria-hidden="true">${item.collapsed ? '▸' : '▾'}</i><span>${esc(title)}</span>` +
  (list === 'mods' ? `<label class="onoff" title="${esc(t('btn.on'))}"><input type="checkbox" data-list="mods" data-i="${i}" data-k="on"${item.off ? '' : ' checked'}></label>` : '') +
  `<button data-act="dup" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.dup'))}" title="${esc(t('btn.dup'))}">⧉</button>` +
  `<button data-act="up" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.up'))}"${i === 0 ? ' disabled' : ''}>↑</button>` +
  `<button data-act="down" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.down'))}"${i === n - 1 ? ' disabled' : ''}>↓</button>` +
  `<button data-act="del" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.del'))}">✕</button></div>`;

function renderCreativeUI() {
  const p = { slotW: parseFloat($('slotW').value) || 0, slotH: parseFloat($('slotH').value) || 0 };
  const shapeOpts = cur => SLOT_SHAPES.map(k => opt(k, shapeName(k), cur)).join('');
  $('bandList').innerHTML = creative.bands.map((b, i, all) => {
    const last = i === all.length - 1;
    const head = cardHead('bands', i, all.length, b.collapsed
      ? `${t('band.n', i + 1)} · ${shapeName(b.shape)} · ${last ? t('band.rest') : fmt(+b.height || 0) + ' mm'}` : t('band.n', i + 1), b);
    if (b.collapsed) return `<div class="card collapsed">${head}</div>`;
    return `<div class="card">${head}<div class="grid2">` +
      `<label>${esc(t('band.shape'))}<select data-list="bands" data-i="${i}" data-k="shape">${shapeOpts(b.shape)}</select></label>` +
      (last ? `<label>${esc(t('band.height'))}<input type="text" value="${esc(t('band.rest'))}" disabled></label>`
            : numField('bands', i, 'height', t('band.height'), b.height, 'min="0" step="1"')) +
      numField('bands', i, 'slotW', t('band.w'), b.slotW, `min="0" step="0.1" placeholder="${fmt(p.slotW)}"`) +
      numField('bands', i, 'slotH', t('band.l'), b.slotH, `min="0.5" step="0.5" placeholder="${fmt(p.slotH)}"`) +
      `</div></div>`;
  }).join('');

  renderPartsUI();
  requestAnimationFrame(drawAllImageWidgets);   // canvases need their layout size
  $('modList').innerHTML = creative.mods.map((m, i, all) => {
    const head = cardHead('mods', i, all.length, `${t('mod.n', i + 1)} · ${m.collapsed ? modText(m) : t('tg.' + m.target)}`, m);
    const cls = 'card' + (m.collapsed ? ' collapsed' : '') + (m.off ? ' off' : '');
    if (m.collapsed) return `<div class="${cls}">${head}</div>`;
    let h = `<div class="${cls}">${head}<div class="grid2">`;
    h += `<label>${esc(t('mod.target'))}<select data-list="mods" data-i="${i}" data-k="target" data-rebuild>${MOD_TARGETS.map(k => opt(k, t('tg.' + k), m.target)).join('')}</select></label>`;
    h += `<label>${esc(t('mod.source'))}<select data-list="mods" data-i="${i}" data-k="source" data-rebuild>${MOD_SOURCES.map(k => opt(k, t('src.' + k), m.source)).join('')}</select></label>`;
    if (m.target === 'slotW' || m.target === 'slotH' || m.target === 'shiftY') {
      h += numField('mods', i, 'from', t('mod.from'), m.from, 'step="0.1"') + numField('mods', i, 'to', t('mod.to'), m.to, 'step="0.1"');
      h += `<div class="span2">${sliderField('mods', i, 'strength', t('mod.strength'), m.strength, 0, 100, 1)}</div>`;
      if (m.target === 'shiftY') h += `<div class="desc span2">${esc(t('mod.shiftHint'))}</div>`;
    } else {
      if (m.target === 'shape') h += `<label>${esc(t('mod.shapeB'))}<select data-list="mods" data-i="${i}" data-k="shapeB">${shapeOpts(m.shapeB)}</select></label>`;
      h += `<div class="span2">${sliderField('mods', i, 'threshold', t('mod.threshold'), m.threshold, 0, 100, 1)}</div>`;
    }
    h += `<label class="check" style="align-self:end"><input type="checkbox" data-list="mods" data-i="${i}" data-k="invert"${m.invert ? ' checked' : ''}> ${esc(t('mod.invert'))}</label>`;
    h += '</div><div class="grid2" style="margin-top:6px">';
    if (m.source === 'linear') {
      h += `<div class="span2">${sliderField('mods', i, 'angle', t('mod.angle'), m.angle, 0, 360, 5)}</div>`;
      h += `<label class="check" style="align-self:end"><input type="checkbox" data-list="mods" data-i="${i}" data-k="mirror"${m.mirror ? ' checked' : ''}> ${esc(t('mod.mirror'))}</label>`;
      h += `<div class="desc span2">${esc(t('mod.angleHint'))}</div>`;
    } else if (m.source === 'radial') {
      h += `<div class="span2">${sliderField('mods', i, 'cx', t('mod.cx'), m.cx, 0, 100, 1)}</div><div class="span2">${sliderField('mods', i, 'cy', t('mod.cy'), m.cy, 0, 100, 1)}</div>`;
      h += numField('mods', i, 'radius', t('mod.radius'), m.radius, 'min="1" step="5"');
    } else if (m.source === 'wave') {
      h += `<div class="span2">${sliderField('mods', i, 'angle', t('mod.angle'), m.angle, 0, 360, 5)}</div>`;
      h += `<div class="span2">${sliderField('mods', i, 'phase', t('mod.phase'), m.phase, 0, 360, 5)}</div>`;
      h += numField('mods', i, 'period', t('mod.period'), m.period, 'min="1" step="5"');
      h += `<div class="desc span2">${esc(t('mod.angleHint'))}</div>`;
    } else if (m.source === 'noise') {
      h += numField('mods', i, 'scale', t('mod.scale'), m.scale, 'min="1" step="5"') + numField('mods', i, 'seed', t('mod.seed'), m.seed, 'step="1"');
    } else if (m.source === 'image') {
      h += `<div class="imgrow span2"><span>${esc(m.img ? m.img.name : t('mod.noImage'))}</span>` +
           `<button data-act="img" data-list="mods" data-i="${i}">${esc(t('mod.pick'))}</button></div>`;
      const fit = m.fit || 'stretch';
      h += `<div class="span2 fitseg" role="group" aria-label="${esc(t('mod.fit'))}">${['stretch', 'contain', 'cover', 'tile'].map(k =>
        `<button type="button" data-act="fit" data-v="${k}" data-list="mods" data-i="${i}" aria-pressed="${fit === k}" title="${esc(t('fit.' + k))}">${FIT_ICONS[k]}${esc(t('fit.s.' + k))}</button>`).join('')}</div>`;
      if (m.img) {
        h += `<div class="span2"><canvas class="placer${fit === 'stretch' ? ' fixed' : ''}" data-placer="${i}"></canvas>` +
             (fit === 'stretch' ? '' : `<div class="desc" style="text-align:center">${esc(t('mod.placeHint'))}</div>`) + `</div>`;
        if (fit !== 'stretch') h += `<div class="span2">${sliderField('mods', i, 'imgScale', t('mod.imgScale'), m.imgScale ?? 100, 10, 400, 1)}</div>`;
        h += `<div class="span2 levels" title="${esc(t('mod.levelsHint'))}"><span style="font-size:12px;color:var(--muted)">${esc(t('mod.levels.title'))}</span>` +
             `<canvas data-levels="${i}"></canvas><div class="lvnums">` +
             numField('mods', i, 'black', t('mod.black'), m.black ?? 0, 'min="0" max="100" step="1"') +
             numField('mods', i, 'gamma', t('mod.gamma'), m.gamma ?? 1, 'min="0.1" max="10" step="0.05"') +
             numField('mods', i, 'white', t('mod.white'), m.white ?? 100, 'min="0" max="100" step="1"') + `</div></div>`;
        h += `<div class="span2">${sliderField('mods', i, 'blur', t('mod.blur'), m.blur ?? 0, 0, 20, 0.5)}</div>`;
      }
      h += `<div class="desc span2">${esc(t('mod.imgHint'))}${fit === 'stretch' ? '' : ' ' + esc(t('mod.fitHint'))}</div>`;
    }
    return h + '</div></div>';
  }).join('');
}

// at the end: glued, tabs & slots, edge interlock; with an offset: glued, tabs through the wall, fingers
const fixOptions = q => (q.offset > 0 ? INNER_FIX : END_FIX).map(k => opt(k, t('mt.pf.' + k), partFix({}, q))).join('');
function renderPartsUI() {
  const kinds = cur => PART_KINDS.map(k => opt(k, t('mt.' + k), cur)).join('');
  $('partList').innerHTML = lampParts.map((q, i, all) => {
    const title = `${t('mt.part.n', i + 1)} · ${t('mt.from.' + q.from)}${q.offset > 0 ? ` +${fmt(q.offset)} mm` : ''} · ${t('mt.' + q.kind)}`;
    const head = cardHead('parts', i, all.length, title, q);

function layout() {

  const [W, H] = outerSize(last.doc);
  const r = view.getBoundingClientRect(), m = 30;
  const base = Math.max(0.01, Math.min((r.width - 2 * m) / W, (r.height - 2 * m - 30) / H));
  const s = base * zoom;
  const svg = stage.firstChild;
  svg.setAttribute('width', W * s);
  svg.setAttribute('height', H * s);
  const x = (r.width - W * s) / 2 + panX, y = (r.height - H * s) / 2 + 12 + panY;
  stage.style.transform = `translate(${x}px, ${y}px)`;
  $('zLabel').textContent = Math.round(zoom * 100) + '%';
}

function setZoom(z, cx, cy) {
  const r = view.getBoundingClientRect();
  if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
  const nz = Math.max(0.1, Math.min(40, z));
  // keep the point under the cursor fixed
  const ox = cx - r.width / 2 - panX, oy = cy - r.height / 2 - panY;
  panX -= ox * (nz / zoom - 1);
  panY -= oy * (nz / zoom - 1);

}

// Drag a band or modulator by its header to reorder it (pointer events: mouse,
// pen and touch). The card is lifted and follows the pointer, a placeholder

// near its edges. The ↑/↓ buttons stay for the keyboard.
function cardPointerDown(e) {
  const head = e.target.closest('.card-head');
  if (!head || e.target.closest('button, input, label') || e.button > 0) return;
  e.preventDefault();
  const x0 = e.clientX, y0 = e.clientY;
  const move = ev => {
    if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
    stop();
    startCardDrag(head, e, ev.clientY);
  };
  const up = () => {   // a click without moving: collapse or expand the card
    stop();
    const item = listOf(head.dataset.list)[+head.dataset.i];
    item.collapsed = !item.collapsed;
    renderCreativeUI();
  };
  const stop = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', stop); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', stop);
}
function startCardDrag(head, e, yNow) {
  const card = head.closest('.card'), box = card.parentElement, list = head.dataset.list, from = +head.dataset.i;
  const scroller = box.closest('.panel'), r = card.getBoundingClientRect(), offY = e.clientY - r.top;
  const ph = document.createElement('div');
  ph.className = 'card-ph';
  ph.style.height = r.height + 'px';
  box.insertBefore(ph, card);
  Object.assign(card.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
  card.classList.add('dragging');
  document.body.classList.add('card-drag');
  let y = yNow, raf = 0, done = false;
  // slide the other cards from their old to their new place
  const slide = change => {
    const others = [...box.children].filter(c => c !== card && c !== ph);
    const before = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
    change();
    for (const c of others) {
      const d = before.get(c) - c.getBoundingClientRect().top;
      if (!d) continue;
      c.style.transition = 'none';
      c.style.transform = `translateY(${d}px)`;
      c.offsetHeight;   // apply before animating back
      c.style.transition = 'transform .15s ease-out';
      c.style.transform = '';
    }
  };
  const place = () => {
    card.style.top = (y - offY) + 'px';
    // the pointer passes a card's middle: the placeholder moves past it (positions without the placeholder)
    const cy = y, others = [...box.children].filter(c => c !== card && c !== ph);
    let top = box.getBoundingClientRect().top, k = 0;
    for (const c of others) {
      const h = c.offsetHeight, t0 = top + 8;
      if (cy > t0 + h / 2) k++;
      top = t0 + h;

    if ([...box.children].filter(c => c !== card).indexOf(ph) !== k) slide(() => box.insertBefore(ph, others[k] || null));
  };

    if (done) return;

    const sr = scroller.getBoundingClientRect(), edge = 48;
    if (y < sr.top + edge) scroller.scrollTop -= Math.ceil((sr.top + edge - y) / 4);

    place();
    raf = requestAnimationFrame(frame);
  };
  const move = ev => { y = ev.clientY; };
  const end = ev => {
    done = true;
    cancelAnimationFrame(raf);

    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    const to = [...box.children].filter(c => c !== card).indexOf(ph);

    card.classList.add('settle');
    card.style.top = ph.getBoundingClientRect().top + 'px';
    setTimeout(() => {
      document.body.classList.remove('card-drag');
      const arr = listOf(list);
      if (to >= 0 && to !== from) arr.splice(to, 0, arr.splice(from, 1)[0]);
      renderCreativeUI();
      if (to !== from) render();
    }, 170);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  raf = requestAnimationFrame(frame);
}

// PNG text chunks: the parameters go into an iTXt chunk (UTF-8) before IEND.
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
async function pngWithParams(blob, json) {
  const png = new Uint8Array(await blob.arrayBuffer()), enc = new TextEncoder();
  const data = new Uint8Array([...enc.encode('kerf-params'), 0, 0, 0, 0, 0, ...enc.encode(json)]);   // keyword, no compression, no language
  const chunk = new Uint8Array(12 + data.length), dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(enc.encode('iTXt'), 4);
  chunk.set(data, 8);
  dv.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)));
  const iend = png.length - 12;   // IEND is always the last 12 bytes
  return new Blob([png.subarray(0, iend), chunk, png.subarray(iend)], { type: 'image/png' });
}
function pngParams(buf) {
  const b = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  for (let o = 8; o + 8 <= b.length;) {
    const len = dv.getUint32(o), type = dec.decode(b.subarray(o + 4, o + 8)), d = b.subarray(o + 8, o + 8 + len);
    if (type === 'iTXt' && dec.decode(d.subarray(0, 11)) === 'kerf-params') {
      let i = 12 + 2;                      // keyword + NUL + flags
      while (d[i]) i++; i++;               // language tag
      while (d[i]) i++; i++;               // translated keyword
      return dec.decode(d.subarray(i));
    }
    o += 12 + len;
  }
  return null;
}

// OBJ with shared vertices (welded at 0.1 µm), so the mesh stays connected in Blender
function objText(tris, name, params) {
  const idx = new Map(), verts = [], faces = [];
  const id = j => {
    const k = `${Math.round(tris[j] * 1e4)},${Math.round(tris[j + 1] * 1e4)},${Math.round(tris[j + 2] * 1e4)}`;
    let i = idx.get(k);
    if (i === undefined) { i = verts.length + 1; idx.set(k, i); verts.push(`v ${f(tris[j])} ${f(tris[j + 1])} ${f(tris[j + 2])}`); }
    return i;
  };
  for (let k = 0; k < tris.length; k += 9) faces.push(`f ${id(k)} ${id(k + 3)} ${id(k + 6)}`);
  return `# Kerf-O-Matic 9000 OBJ, units mm\n# kerf-params: ${params}\no ${name}\n${verts.join('\n')}\n${faces.join('\n')}\n`;
}

$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const ext = file.name.toLowerCase().split('.').pop();
  if (ext === 'stl') { alert(t('alert.stlLoad')); return; }
  let json = null;
  try {
    if (ext === 'png') json = pngParams(await file.arrayBuffer());
    else if (ext === 'obj') json = ((await file.text()).match(/^# kerf-params: (.*)$/m) || [])[1];
    else json = new DOMParser().parseFromString(await file.text(), 'image/svg+xml').getElementById('kerf-params')?.textContent;
    writeParams(JSON.parse(json));
    render();
  } catch (err) {
    alert(t('alert.noParams'));
  }
};

$('lang').addEventListener('change', () => {
  lang = $('lang').value;
  try { localStorage.setItem('kerf-lang', lang); } catch (e) {}
  applyLang();
  render();
});

const STORE_KEYS = ['kerf-params', 'kerf-view', 'kerf-3d'];
function clearStore() { for (const k of STORE_KEYS) try { localStorage.removeItem(k); } catch (e) {} }
$('resetLink').onclick = e => {
  e.preventDefault();
  if (!confirm(t('reset.confirm'))) return;
  clearStore();
  location.reload();
};

applyLang();
// Settings saved by an older version must never block the start: if they
// fail to load or render, drop them and start from the defaults.
try {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('kerf-params')); } catch (err) {}   // storage may be unavailable
  if (saved) writeParams(saved);
  syncDiameter();
  render();
  try { sessionStorage.removeItem('kerf-reset'); } catch (err) {}
} catch (e) {
  console.warn('Saved settings could not be restored, using defaults.', e);
  clearStore();
  // reload once; never loop if the defaults fail as well
  let retried = false;
  try { retried = sessionStorage.getItem('kerf-reset') === '1'; sessionStorage.setItem('kerf-reset', '1'); } catch (err) { retried = true; }
  if (!retried) location.reload(); else throw e;
}
</script>
