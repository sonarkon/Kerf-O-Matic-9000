<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf-O-Matic 9000</title>
<style>
  :root {
    --bg: #f3f1ec; --panel: #ffffff; --text: #1d1b18; --muted: #6b665e;
    --line: #dcd7cd; --accent: #b4441c; --accent-ink: #fff; --board: #efe0c6;
    --cut: #c40000; --engrave: #1d1b18; --input: #faf9f6; --card: #f7f5f0;
    --ok: #2f7d32; --warn: #a66a00; --bad: #c0261b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #211f24; --text: #ece9e3; --muted: #9b968d;
      --line: #36333a; --accent: #e0703f; --accent-ink: #1a1009; --board: #3a3224;
      --cut: #ff5a4a; --engrave: #ece9e3; --input: #2a282e; --card: #29272d;
      --ok: #6cc070; --warn: #e3a83a; --bad: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; height: 100vh;
    grid-template-columns: 310px 1fr 280px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "header header header" "design view output";
  }
  header {
    grid-area: header; display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .seg { width: auto; flex-shrink: 0; }
  header .seg label { padding: 7px 14px; white-space: nowrap; }
  header .project {
    font: inherit; color: var(--text); background: var(--input);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; flex: 0 1 240px; min-width: 120px;
  }
  header .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  header .actions button { white-space: nowrap; }
  header #lang { width: auto; padding-right: 22px; }
  .savegroup { position: relative; display: flex; }
  .savegroup #saveBtn { border-radius: 6px 0 0 6px; min-width: 96px; }
  .savegroup .caret { border-radius: 0 6px 6px 0; border-left: 1px solid #ffffff55; padding: 8px 9px; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 260px; padding: 4px;
    display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px #0003;
  }
  .menu button { border: 0; background: none; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; white-space: normal; }
  .menu button:hover, .menu button:focus-visible { background: var(--input); }
  .menu span { font-size: 12px; color: var(--muted); }
  .panel {
    background: var(--panel); padding: 12px 16px 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .panel > * { flex-shrink: 0; }
  #design { grid-area: design; border-right: 1px solid var(--line); }
  #output { grid-area: output; border-left: 1px solid var(--line); gap: 14px; }
  main { grid-area: view; }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  h2, summary { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  details.sec { border-bottom: 1px solid var(--line); padding: 8px 0 12px; }
  details.sec:last-of-type { border-bottom: 0; }
  details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  details.sec > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  details.sec > summary::-webkit-details-marker { display: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .span2 { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  input[type=number], input[type=text], select {
    font: inherit; color: var(--text); background: var(--input);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
  }
  input:disabled, select:disabled { opacity: .55; }
  .checks { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg label { flex-direction: row; justify-content: center; padding: 7px; cursor: pointer; color: var(--text); font-size: 13px; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button {
    font: inherit; border-radius: 6px; padding: 8px 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--input); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.add { width: 100%; margin-top: 8px; padding: 6px; border-style: dashed; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .card-head { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
  .card-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head button { padding: 1px 7px; font-size: 12px; line-height: 1.4; }
  .card .grid2, .card .grid3 { gap: 6px; }
  .card input, .card select { padding: 4px 6px; font-size: 13px; }
  .card .imgrow { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .card .imgrow button { padding: 4px 8px; font-size: 12px; }
  .card .imgrow img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  .info {
    font-size: 12px; line-height: 1.5; color: var(--muted);
    background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    word-break: break-word;
  }
  .info b { color: var(--text); font-weight: 600; }
  .info code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .info table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .info td { padding: 1px 4px 1px 0; }
  .info p { margin: 6px 0 0; }
  .info .fine { font-size: 11px; opacity: .8; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats div { display: flex; flex-direction: column; }
  .stats span { font-size: 11px; }
  .stats strong { font-size: 20px; line-height: 1.2; color: var(--text); font-variant-numeric: tabular-nums; }
  .stats strong.ok, .stats em.ok { color: var(--ok); }
  .stats strong.warn, .stats em.warn { color: var(--warn); }
  .stats strong.bad, .stats em.bad { color: var(--bad); }
  .stats em { font-style: normal; font-size: 11px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .credit { margin-top: auto; padding-top: 12px; font-size: 11px; color: var(--muted); }
  .credit a { color: inherit; }
  main { position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  main.dragging { cursor: grabbing; }
  main.dark { background: #0f0d0c; }
  #stage { position: absolute; left: 0; top: 0; }
  #stage svg { display: block; overflow: visible; }
  #stage svg .cuts *, #stage svg .boards * { vector-effect: non-scaling-stroke; }
  /* one bar across the preview: 2D/3D on the left, bend + overlays on the right; wraps when narrow */
  .topbar { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; display: flex; flex-wrap: wrap;
            justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .viewbar { display: flex; gap: 8px; }
  .viewseg { width: 130px; }
  .viewseg label { padding: 5px; font-size: 12px; }
  .pill {
    flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
  }
  .pill input[type=range] { width: 140px; accent-color: var(--accent); }
  .pill output { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .toggles { display: flex; gap: 6px; margin-left: auto; }
  .iconbtn {
    position: relative; width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center; cursor: pointer; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .iconbtn input { position: absolute; opacity: 0; width: 0; height: 0; }
  .iconbtn:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .iconbtn.lamp:has(input:checked) { color: #2b1a00; background: #ffc35a; border-color: #ffc35a; box-shadow: 0 0 14px #ffb04a99; }
  .iconbtn.lamp:has(input:checked) svg { fill: #fff3d0; }
  .iconbtn.flex:has(input:checked) { color: #fff; background: linear-gradient(135deg, #3e9b4f, #e0a526 55%, #d6332a); border-color: transparent; }
  #three { position: absolute; inset: 0; }
  #three canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .threemsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  .zoom {
    position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
  }
  .zoom button { padding: 4px 10px; }
  .zoom span { min-width: 48px; text-align: center; font-size: 12px; color: var(--muted); }
  .hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); }
  @media (max-width: 1100px) {
    body {
      grid-template-columns: 310px 1fr; grid-template-rows: auto 1fr auto;
      grid-template-areas: "header header" "design view" "output output";
      height: auto; min-height: 100vh;
    }
    header { flex-wrap: wrap; }
    main { min-height: 70vh; }
    #design { max-height: calc(70vh + 60px); }
    #output { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  @media (max-width: 720px) {
    body {
      grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto;
      grid-template-areas: "header" "design" "view" "output";
    }
    header { gap: 10px; }
    header .seg { width: 100%; order: 3; }
    header .project { width: 100%; order: 2; }
    #design { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
    main { min-height: 0; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <input type="text" id="project" class="project" maxlength="80" data-i18n-placeholder="project.ph" data-i18n-aria="project">
  <div class="seg" role="radiogroup" data-i18n-aria="mode.aria">
    <label><input type="radio" name="mode" value="pattern" checked> <span data-i18n="mode.pattern"></span></label>
    <label><input type="radio" name="mode" value="creative"> <span data-i18n="mode.creative"></span></label>
    <label><input type="radio" name="mode" value="test"> <span data-i18n="mode.test"></span></label>
  </div>
  <div class="actions">
    <select id="lang" aria-label="Language / Sprache">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
    <button id="loadBtn" data-i18n="load"></button>
    <div class="savegroup">
      <button class="primary" id="saveBtn"></button>
      <button class="primary caret" id="saveMenuBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="save.more">▾</button>
      <div class="menu" id="saveMenu" role="menu" hidden>
        <button role="menuitem" data-fmt="svg"><b data-i18n="fmt.svg"></b><span data-i18n="fmt.svg.d"></span></button>
        <button role="menuitem" data-fmt="stl"><b data-i18n="fmt.stl"></b><span class="bendDesc"></span></button>
        <button role="menuitem" data-fmt="obj"><b data-i18n="fmt.obj"></b><span class="bendDesc"></span></button>
        <button role="menuitem" data-fmt="png"><b data-i18n="fmt.png"></b><span data-i18n="fmt.png.d"></span></button>
      </div>
    </div>
  </div>
  <input type="file" id="loadFile" accept=".svg,image/svg+xml" hidden>
  <input type="file" id="imgFile" accept="image/*" hidden>
</header>

<aside id="design" class="panel">
  <details class="sec" open>
    <summary data-i18n="sec.board"></summary>
    <div class="grid2">
      <label><span data-i18n="boardW"></span><input type="number" id="boardW" value="150" min="1" step="0.5"></label>
      <label><span data-i18n="boardH"></span><input type="number" id="boardH" value="100" min="1" step="0.5"></label>
      <label><span data-i18n="thick"></span><input type="number" id="thick" value="3" min="0.1" step="0.1"></label>
      <label><span data-i18n="material"></span><select id="material"></select></label>
      <label><span data-i18n="diameter"></span><input type="number" id="diameter" min="0.1" step="0.5"></label>
      <label><span data-i18n="diaRef"></span><select id="diaRef">
        <option value="inner" data-i18n="ref.inner"></option>
        <option value="mid" data-i18n="ref.mid"></option>
        <option value="outer" data-i18n="ref.outer"></option>
      </select></label>
    </div>
    <div class="desc" id="diaSummary"></div>
    <div class="checks" data-modes="pattern creative">
      <label class="check"><input type="checkbox" id="seamless"> <span data-i18n="seamless"></span></label>
    </div>
  </details>

  <details class="sec" open>
    <summary data-i18n="sec.shape"></summary>
    <select id="shape"></select>
    <div class="desc" id="shapeDesc"></div>
    <div class="desc warn" id="meanderNote" hidden data-i18n="cr.meanderNote"></div>
  </details>

  <details class="sec" open>
    <summary data-i18n="sec.slot"></summary>
    <div class="grid2">
      <label><span data-i18n="slotH"></span><input type="number" id="slotH" value="20" min="0.1" step="0.5"></label>
      <label><span data-i18n="slotW"></span><input type="number" id="slotW" value="2" min="0" step="0.1"></label>
      <label><span data-i18n="gapY"></span><input type="number" id="gapY" value="4" min="0.1" step="0.1"></label>
      <label><span data-i18n="gapX"></span><input type="number" id="gapX" value="2" min="0.1" step="0.1"></label>
      <label><span data-i18n="offsetMode"></span><select id="offsetMode">
        <option value="top" data-i18n="off.top"></option>
        <option value="center" selected data-i18n="off.center"></option>
        <option value="custom" data-i18n="off.custom"></option>
      </select></label>
      <label><span data-i18n="offset"></span><input type="number" id="offset" value="0" step="0.5"></label>
    </div>
    <div class="desc" data-modes="creative" data-i18n="cr.baseHint"></div>
  </details>

  <details class="sec" open data-modes="creative">
    <summary data-i18n="sec.bands"></summary>
    <div class="desc" data-i18n="bands.desc"></div>
    <div id="bandList"></div>
    <button class="add" id="addBand" data-i18n="bands.add"></button>
  </details>

  <details class="sec" open data-modes="creative">
    <summary data-i18n="sec.mods"></summary>
    <div class="desc" data-i18n="mods.desc"></div>
    <div id="modList"></div>
    <button class="add" id="addMod" data-i18n="mods.add"></button>
  </details>

  <details class="sec" open data-modes="test">
    <summary data-i18n="sec.test"></summary>
    <div class="grid2">
      <label class="span2"><span data-i18n="testParam"></span><select id="testParam">
        <option value="gapX" data-i18n="p.gapX"></option>
        <option value="slotH" data-i18n="p.slotH"></option>
        <option value="gapY" data-i18n="p.gapY"></option>
        <option value="slotW" data-i18n="p.slotW"></option>
      </select></label>
      <label><span data-i18n="testFrom"></span><input type="number" id="testFrom" value="1" min="0" step="0.1"></label>
      <label><span data-i18n="testTo"></span><input type="number" id="testTo" value="3" min="0" step="0.1"></label>
      <label><span data-i18n="testCount"></span><input type="number" id="testCount" value="5" min="2" max="30" step="1"></label>
      <label><span data-i18n="testSize"></span>
        <span style="display:flex;gap:4px"><input type="number" id="testW" value="80" min="10" step="1"><input type="number" id="testH" value="40" min="5" step="1"></span>
      </label>
    </div>
    <div class="desc" data-i18n="testDesc"></div>
  </details>
</aside>

<main id="view">
  <div id="stage"></div>
  <div class="topbar">
  <div class="viewbar" data-modes="pattern creative">
    <div class="seg viewseg" role="radiogroup" data-i18n-aria="view.aria">
      <label><input type="radio" name="view" value="2d" checked> <span data-i18n="view.2d"></span></label>
      <label><input type="radio" name="view" value="3d"> <span data-i18n="view.3d"></span></label>
    </div>
  </div>
  <div class="toggles" id="overlayCtl">
    <label class="pill" id="bendCtl"><span data-i18n="bend"></span><input type="range" id="bend" min="0" max="100" value="100"><output id="bendVal">100 %</output></label>
    <label class="iconbtn lamp" data-i18n-title="lamp">
      <input type="checkbox" id="lampOn" data-i18n-aria="lamp">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/>
      </svg>
    </label>
    <label class="iconbtn flex" data-i18n-title="flexOverlay">
      <input type="checkbox" id="flexOn" data-i18n-aria="flexOverlay">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 14.76V4a2 2 0 1 0-4 0v10.76a4 4 0 1 0 4 0z"/><path d="M12 9v7"/>
      </svg>
    </label>
  </div>
  </div>
  <div id="three" hidden><div class="threemsg" id="threeMsg"></div></div>
  <div class="hint" id="hint"></div>
  <div class="zoom">
    <button id="zOut" data-i18n-aria="zoomOut">−</button>
    <span id="zLabel">100%</span>
    <button id="zIn" data-i18n-aria="zoomIn">+</button>
    <button id="zFit" data-i18n="fit"></button>
  </div>
</main>

<aside id="output" class="panel">
  <section>
    <h2 data-i18n="sec.output"></h2>
    <div class="grid2">
      <label><span data-i18n="marginX"></span><input type="number" id="marginX" value="0" min="0" step="0.5"></label>
      <label><span data-i18n="order"></span><select id="order">
        <option value="zigzag" data-i18n="ord.zigzag"></option>
        <option value="skip" data-i18n="ord.skip"></option>
      </select></label>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="openEdges"> <span data-i18n="openEdges"></span></label>
      <label class="check"><input type="checkbox" id="border" checked> <span data-i18n="border"></span></label>
      <label class="check"><input type="checkbox" id="rotate"> <span data-i18n="rotate"></span></label>
      <label class="check"><input type="checkbox" id="paramVisible" checked> <span data-i18n="paramVisible"></span></label>
    </div>
  </section>

  <section>
    <h2 data-i18n="sec.flex"></h2>
    <div class="info" id="flexInfo"></div>
  </section>

  <section>
    <h2 data-i18n="sec.file"></h2>
    <div class="info" id="info"></div>
  </section>

  <footer class="credit">
    © 2026 sonarkon ·
    <a href="https://github.com/sonarkon/Kerf-O-Matic-9000" target="_blank" rel="noopener" data-i18n="credit.link"></a> ·
    <a href="#" id="resetLink" data-i18n="reset"></a>
  </footer>
</aside>

<script>
const $ = id => document.getElementById(id);
const f = v => +v.toFixed(4);              // compact number for SVG output
const fmt = v => String(+(+v).toFixed(3)); // for filenames / labels
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mod = (a, n) => ((a % n) + n) % n;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ---------------------------------------------------------------- i18n
const STR = {
  en: {
    'title': 'Kerf-O-Matic 9000',
    'project': 'Project name', 'project.ph': 'Project name (optional)',
    'mode.aria': 'Mode', 'mode.pattern': 'Pattern', 'mode.creative': 'Creative', 'mode.test': 'Test strips',

function applyLang() {

// ---------------------------------------------------------------- shapes
// Each shape returns SVG element strings for a slot centred at (cx, cy)
// with half-width hw and half-height hh (all in mm).
const NECK_RATIO = 0.4;  // dogbone neck / S-slot width as a fraction of the slot width
const SHAPES = {
  Pill: {
    draw(cx, cy, hw, hh) {
      if (hw <= 0) return [`<line x1="${f(cx)}" y1="${f(cy - hh)}" x2="${f(cx)}" y2="${f(cy + hh)}"/>`];

    }
    case 'noise': {
      const s = Math.max(0.5, m.scale), seed = Math.round(m.seed) || 0;
      return (x, y) => {
        const v = 0.67 * valueNoise(x / s, y / s, seed) + 0.33 * valueNoise(2 * x / s, 2 * y / s, seed + 17);
        return (v - 0.5) * 1.8 + 0.5;   // stretch: octave mixing compresses the range
      };
    }
    case 'image': {
      const g = m.img && imageGrid(m.img.url);
      return g ? (x, y) => sampleGrid(g, x / W, y / H) : null;
    }
  }
  return null;
}

const MIN_BAR = 0.4, MIN_GAP = 0.4;   // smallest material left between slots (mm)
function creativeSlotFn(p, W, H) {
  const baseShape = SHAPES[p.shape].meander ? 'Pill' : p.shape;
  const stepX = (SHAPES[p.shape].line ? 0 : p.slotW) + p.gapX, stepY = p.slotH + p.gapY;
  const maxHw = Math.max(0, (stepX - MIN_BAR) / 2), maxHh = Math.max(0.25, (stepY - MIN_GAP) / 2);
  const bands = creative.bands, ends = [];
  let acc = 0;
  for (const b of bands) ends.push(acc += Math.max(0, +b.height || 0));
  const mods = creative.mods.map(m => ({ m, fn: modSource(m, W, H) })).filter(o => o.fn);
  const num = v => v === null || v === '' || v === undefined || isNaN(+v) ? null : +v;
  return (x, y) => {
    let shape = baseShape, sw = p.slotW, sh = p.slotH, skip = false;
    if (bands.length) {
      let i = ends.findIndex(e => y < e);
      if (i < 0) i = bands.length - 1;
      const b = bands[i];
      if (SHAPES[b.shape] && !SHAPES[b.shape].meander) shape = b.shape;
      if (num(b.slotW) != null) sw = num(b.slotW);
      if (num(b.slotH) != null) sh = num(b.slotH);
    }
    for (const { m, fn } of mods) {
      let v = clamp(fn(x, y), 0, 1);
      if (m.invert) v = 1 - v;
      if (m.target === 'skip') { if (v > m.threshold / 100) skip = true; }
      else if (m.target === 'shape') { if (v > m.threshold / 100 && SHAPES[m.shapeB]) shape = m.shapeB; }
      else {
        const mapped = m.from + (m.to - m.from) * v, s = clamp(m.strength / 100, 0, 1);
        if (m.target === 'slotW') sw += (mapped - sw) * s; else sh += (mapped - sh) * s;
      }
    }
    return { shape, hw: clamp(sw / 2, 0, maxHw), hh: clamp(sh / 2, 0.25, maxHh), skip };
  };
}

// ---------------------------------------------------------------- flex estimate
// Lattice hinge: bending is taken up by twisting the vertical bars between
// slot columns. A bar segment links slot A (column k) with its staggered
// neighbour B (column k+1, ±pitch/2). Its free length is Lt = (hA + hB)/2 −
// pitch/2 and it twists by the rotation between the columns, θ = Δx / R.
// For a rectangular bar (a × b, b ≤ a) the max shear strain is
// γ = θ·b·β / (α·Lt) (Saint-Venant coefficients); tensile ε = γ / 2.
// With R = D/2 this gives ε = k / D, k = Δx·b·β / (α·Lt).
const TORSION = { r: [1, 1.5, 2, 2.5, 3, 4, 6, 10, 1e9],
  alpha: [.208, .231, .246, .258, .267, .282, .299, .312, .333],
  beta:  [.141, .196, .229, .249, .263, .281, .299, .312, .333] };
function torsionCoeffs(ratio) {
  const { r, alpha, beta } = TORSION;
  for (let i = 1; i < r.length; i++) if (ratio <= r[i]) {
    const u = (ratio - r[i - 1]) / (r[i] - r[i - 1]);
    return { a: alpha[i - 1] + u * (alpha[i] - alpha[i - 1]), b: beta[i - 1] + u * (beta[i] - beta[i - 1]) };
  }
  return { a: .333, b: .333 };
}
// Sets rec.kf (worst k of its links) and rec.rigid on every slot; returns the
// overall worst k or a reason why no estimate is possible.
function flexAnalysis(p, gen) {
  if (SHAPES[p.shape].meander && p.mode !== 'creative') return { reason: 'r.meander' };
  if (!(p.thick > 0)) return { reason: 'r.thick' };
  const { cols, slots, stepY, h } = gen;
  if (cols.length < 2) return { reason: 'r.cols' };
  const key = (k, y) => k + ':' + Math.round(y * 1000);
  const byKey = new Map(slots.map(s => [key(s.k, s.y), s]));
  for (const s of slots) { s.kf = 0; s.rigid = false; }
  let worst = 0, solid = false, links = 0;
  for (const A of slots) {
    if (A.k >= cols.length - 1 || A.status === 'edge') continue;
    const dx = cols[A.k + 1].x - A.x;
    for (const dy of [-stepY / 2, stepY / 2]) {
      const yb = A.y + dy;
      if (yb < 0 || yb > h) continue;
      const B = byKey.get(key(A.k + 1, yb));
      if (!B || B.status === 'edge') continue;
      links++;
      const bar = dx - (A.hw + B.hw);
      const Lt = A.hh + B.hh - stepY / 2;
      if (A.status === 'skip' || B.status === 'skip' || Lt <= 0 || bar <= 0) {
        A.rigid = B.rigid = solid = true;
        continue;
      }
      const a = Math.max(bar, p.thick), b = Math.min(bar, p.thick), c = torsionCoeffs(a / b);
      const kl = dx * b * c.b / (c.a * Lt);
      A.kf = Math.max(A.kf, kl); B.kf = Math.max(B.kf, kl);
      worst = Math.max(worst, kl);
    }
  }
  if (!worst) return { reason: links ? 'r.overlap' : 'r.noLinks' };
  return { k: worst, solid };
}
function flexStatus(eps, m) {
  const cls = eps <= m.ok ? 'ok' : eps <= m.max ? 'warn' : 'bad';
  return [cls, t('st.' + cls)];
}
const HEAT = { ok: '#3e9b4f', warn: '#e0a526', bad: '#d6332a', rigid: '#5c0d18', none: '#9a948a' };
function heatColor(rec, dMid, mat) {
  if (rec.rigid) return HEAT.rigid;
  if (!rec.kf) return HEAT.none;
  const e = rec.kf / dMid * 100;
  return e <= mat.ok ? HEAT.ok : e <= mat.max ? HEAT.warn : HEAT.bad;
}

// ---------------------------------------------------------------- document
const LABEL_ZONE = 10;  // solid strip on test coupons for the engraved label
const TEST_SPACING = 3;

function buildDoc(p) {
  const doc = { boards: [], cuts: [], recs: [], borders: [], labels: [], count: 0, rows: [] };
  const mat = MATERIALS[p.material], dMid = midDiameter(p);

  if (p.mode === 'test') {
    const short = TEST_SHORT[p.testParam];
    const w = p.testW, h = p.testH, n = p.testCount;
    for (let i = 0; i < n; i++) {
      const v = +(p.testFrom + (p.testTo - p.testFrom) * i / (n - 1)).toFixed(3);
      const q = { ...p, [p.testParam]: v, seamless: false };
      // rotated output turns top→right, so stack in reverse to keep ascending values left → right
      const y0 = (p.rotate ? n - 1 - i : i) * (h + TEST_SPACING);
      const gen = generate(q, w, h, LABEL_ZONE, w - p.marginX);
      const fl = gen ? flexAnalysis(q, gen) : { reason: 'r.cols' };
      const eps = fl.k ? fl.k / dMid * 100 : null;
      const dMin = fl.k ? fl.k / (mat.ok / 100) : null;
      doc.rows.push({ v, eps, dMin, reason: fl.reason });
      doc.boards.push({ x: 0, y: y0, w, h });
      if (gen) {
        const cuts = orderCuts(gen.columns, p.order);
        doc.count += cuts.length;
        doc.cuts.push(`<g transform="translate(0,${f(y0)})">${cuts.join('')}</g>`);
      }
      doc.borders.push(`<rect x="0" y="${f(y0)}" width="${f(w)}" height="${f(h)}"/>`);
      const lines = [`${short} ${fmt(v)}`, dMin ? `Ø≥${Math.round(dMin - p.thick)}` : ''];
      lines.forEach((txt, j) => txt && doc.labels.push(
        `<text transform="translate(${f(3.2 + j * 4)},${f(y0 + h / 2)}) rotate(-90)" text-anchor="middle">${esc(txt)}</text>`));
    }
    doc.w = w;
    doc.h = n * h + (n - 1) * TEST_SPACING;
    doc.rotate = p.rotate;
    return doc;
  }

  const w = p.boardW, h = p.boardH;
  const slotFn = p.mode === 'creative' ? creativeSlotFn(p, w, h) : null;
  const gen = generate(p, w, h, p.marginX, w - p.marginX, slotFn);
  doc.gen = gen;
  doc.boards.push({ x: 0, y: 0, w, h });
  if (gen) {
    doc.cuts = orderCuts(gen.columns, p.order);
    doc.recs = gen.columns.flat();
    doc.flex = flexAnalysis(p, gen);
  }
  doc.count = doc.cuts.length;
  if (p.border) doc.borders.push(`<rect x="0" y="0" width="${f(w)}" height="${f(h)}"/>`);
  doc.w = w; doc.h = h; doc.rotate = p.rotate;
  return doc;
}

function flexSummary(p, doc) {
  const mat = MATERIALS[p.material], dMid = bendDiameter(p), th = p.thick;
  if (!doc.flex || doc.flex.reason) return { text: doc.flex ? t(doc.flex.reason) : '' };
  const eps = doc.flex.k / dMid * 100;
  const dMin = doc.flex.k / (mat.ok / 100);  // mid-plane diameter at the "ok" limit
  const over = doc.recs.filter(r => r.kf / dMid * 100 > mat.max).length;
  const rigid = doc.recs.filter(r => r.rigid).length;
  return { eps, dMin, dMinInner: dMin - th, status: flexStatus(eps, mat), over, rigid };
}

const shapeName = k => t('shape.' + k);
function modText(m) {
  const src = {
    linear: () => `${fmt(m.angle)}°${m.mirror ? ' ↔' : ''}`,
    radial: () => `${fmt(m.cx)}/${fmt(m.cy)} %, r ${fmt(m.radius)} mm`,
    wave: () => `${fmt(m.angle)}°, ${fmt(m.period)} mm, ${fmt(m.phase)}°`,
    noise: () => `${fmt(m.scale)} mm, seed ${m.seed}`,
    image: () => m.img ? m.img.name : '–'
  }[m.source]();
  const tgt = m.target === 'skip' ? `> ${fmt(m.threshold)} %`
    : m.target === 'shape' ? `→ ${shapeName(m.shapeB)} > ${fmt(m.threshold)} %`
    : `${fmt(m.from)} → ${fmt(m.to)} mm, ${fmt(m.strength)} %`;
  return `${t('tg.' + m.target)} ← ${t('src.' + m.source)} (${src})${m.invert ? ' inv' : ''}: ${tgt}`;
}

function paramLines(p, doc) {
  const dm = midDiameter(p), th = p.thick;
  const L = [];
  if (p.project) L.push(t('pl.project', p.project));
  L.push(t('pl.mode', t('mode.' + p.mode)));
  if (p.mode === 'test') {
    L.push(t('pl.test', t('p.' + p.testParam), fmt(p.testFrom), fmt(p.testTo), p.testCount));
    L.push(t('pl.strip', fmt(p.testW), fmt(p.testH), LABEL_ZONE));
    L.push(t('pl.target', (dm - th).toFixed(1), dm.toFixed(1)));
  } else {
    L.push(t('pl.board', fmt(p.boardW), fmt(p.boardH)));
    L.push(t('pl.dia', (dm - th).toFixed(2), dm.toFixed(2), (dm + th).toFixed(2)));
  }
  L.push(t('pl.material', t('mat.' + p.material), fmt(th)));
  L.push(t('pl.shape', shapeName(p.shape)));
  L.push(t('pl.slot', fmt(p.slotW), fmt(p.slotH)));
  const seam = p.mode !== 'test' && doc.gen?.seamGap != null;
  L.push(t('pl.gaps', fmt(p.gapY), seam ? t('pl.seamGap', fmt(+doc.gen.seamGap.toFixed(3)), fmt(p.gapX)) : `${fmt(p.gapX)} mm`));
  const offH = p.mode === 'test' ? p.testH : p.boardH;
  L.push(t('pl.offset', t('off.' + p.offsetMode), fmt(effectiveOffset(p, offH))));
  if (p.mode !== 'test') L.push(t('pl.seamless', p.seamless, doc.gen?.cols.length ?? 0));
  if (p.mode === 'creative') {
    const c = p.creative;
    c.bands.forEach((b, i) => L.push(t('pl.band', i + 1, shapeName(b.shape),
      i === c.bands.length - 1 ? t('band.rest') : `${fmt(+b.height || 0)} mm`,
      b.slotW == null || b.slotW === '' ? fmt(p.slotW) : fmt(+b.slotW),
      b.slotH == null || b.slotH === '' ? fmt(p.slotH) : fmt(+b.slotH))));
    c.mods.forEach((m, i) => L.push(t('pl.mod', i + 1, modText(m))));
  }
  L.push(t('pl.rotated', p.rotate));
  L.push(t('pl.edges', fmt(p.marginX), p.openEdges, p.mode === 'test' || p.border));
  L.push(t('pl.order', t('ord.' + p.order)));
  if (p.mode !== 'test') {
    const fs = flexSummary(p, doc);
    if (fs.eps != null) L.push(t('pl.flex', fs.eps.toFixed(2), fs.status[1], Math.round(fs.dMinInner), view3d.bend));
  }
  L.push(t('pl.footer', doc.count, new Date().toISOString().slice(0, 16).replace('T', ' ')));
  return L;
}

// File-name safe project slug: transliterate umlauts, keep [a-z0-9-].
function slug(s) {
  return s.toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}
function fileName(p, doc) {
  const parts = [p.mode === 'test' ? 'kerftest' : 'kerf', p.shape.toLowerCase(), p.material];
  const proj = slug(p.project || '');
  if (proj) parts.unshift(proj);
  if (p.mode === 'test') {
    parts.push(`${TEST_SHORT[p.testParam]}${fmt(p.testFrom)}-${fmt(p.testTo)}x${p.testCount}`, `${fmt(p.testW)}x${fmt(p.testH)}x${fmt(p.thick)}mm`);
  } else {
    parts.push(`${fmt(p.boardW)}x${fmt(p.boardH)}x${fmt(p.thick)}mm`);
  }
  const gx = p.mode !== 'test' && doc.gen?.seamGap != null ? +doc.gen.seamGap.toFixed(3) : p.gapX;
  parts.push(`slot${fmt(p.slotW)}x${fmt(p.slotH)}`, `gapV${fmt(p.gapY)}`, `gapH${fmt(gx)}`);
  const off = effectiveOffset(p, p.mode === 'test' ? p.testH : p.boardH);
  if (off) parts.push(`ofs${fmt(off)}`);
  if (p.marginX) parts.push(`m${fmt(p.marginX)}`);
  if (p.mode === 'creative') parts.push(`creative-b${p.creative.bands.length}m${p.creative.mods.length}`);
  if (p.mode !== 'test' && p.seamless) parts.push('seamless');
  if (p.openEdges) parts.push('open');
  if (p.mode !== 'test' && p.border) parts.push('border');
  if (p.rotate) parts.push('rot90');
  return parts.join('_') + '.svg';
}

// Rotation by 90° clockwise: (x, y) → (H − y, x)
const rotTransform = doc => doc.rotate ? ` transform="matrix(0,1,-1,0,${f(doc.h)},0)"` : '';
const outerSize = doc => doc.rotate ? [doc.h, doc.w] : [doc.w, doc.h];

// Export document: separate Inkscape-compatible layers for cuts, border,
// engraving and parameters. The parameter block sits below the work area.
function buildSVG(p, doc) {
  const [W, H] = outerSize(doc);
  const lines = paramLines(p, doc);
  const fs = 3.5, lh = fs * 1.4, pad = 5;
  const totalH = H + pad + lines.length * lh + 2;
  const { paramVisible, ...meta } = p;
  if (meta.mode !== 'creative') delete meta.creative;
  const tr = rotTransform(doc);
  const out = [];
  out.push('<?xml version="1.0" encoding="UTF-8"?>');
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="${f(W)}mm" height="${f(totalH)}mm" viewBox="0 0 ${f(W)} ${f(totalH)}">`);
  out.push(`  <title>${esc(p.project || fileName(p, doc))}</title>`);
  out.push(`  <desc>${esc(lines.join(' | '))}</desc>`);
  out.push(`  <metadata id="kerf-params">${esc(JSON.stringify({ generator: 'kerf-generator', unit: 'mm', ...meta }))}</metadata>`);
  out.push(`  <g id="cuts" inkscape:groupmode="layer" inkscape:label="${t('layer.cuts')}" stroke="#ff0000" stroke-width="0.1" fill="none"${tr}>`);
  for (const c of doc.cuts) out.push('    ' + c);
  out.push('  </g>');
  if (doc.borders.length) {
    out.push(`  <g id="border" inkscape:groupmode="layer" inkscape:label="${t('layer.border')}" stroke="#ff0000" stroke-width="0.1" fill="none"${tr}>`);
    for (const b of doc.borders) out.push('    ' + b);
    out.push('  </g>');
  }
  if (doc.labels.length) {
    out.push(`  <g id="engrave" inkscape:groupmode="layer" inkscape:label="${t('layer.engrave')}" fill="#000000" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="3"${tr}>`);
    for (const l of doc.labels) out.push('    ' + l);
    out.push('  </g>');
  }
  out.push(`  <g id="parameter" inkscape:groupmode="layer" inkscape:label="${t('layer.params')}" fill="#0000ff" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="${fs}"${paramVisible ? '' : ' style="display:none"'}>`);
  lines.forEach((txt, i) => out.push(`    <text x="0" y="${f(H + pad + fs + i * lh)}">${esc(txt)}</text>`));
  out.push('  </g>');
  out.push('</svg>');
  return out.join('\n');
}

// ---------------------------------------------------------------- creative UI
const opt = (v, label, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
const numField = (list, i, key, label, val, extra = '') =>
  `<label>${esc(label)}<input type="number" data-list="${list}" data-i="${i}" data-k="${key}" value="${val ?? ''}" ${extra}></label>`;
const cardHead = (list, i, n, title) =>
  `<div class="card-head"><span>${esc(title)}</span>` +
  `<button data-act="up" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.up'))}"${i === 0 ? ' disabled' : ''}>↑</button>` +
  `<button data-act="down" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.down'))}"${i === n - 1 ? ' disabled' : ''}>↓</button>` +
  `<button data-act="del" data-list="${list}" data-i="${i}" aria-label="${esc(t('btn.del'))}">✕</button></div>`;

function renderCreativeUI() {
  const p = { slotW: parseFloat($('slotW').value) || 0, slotH: parseFloat($('slotH').value) || 0 };
  const shapeOpts = cur => SLOT_SHAPES.map(k => opt(k, shapeName(k), cur)).join('');
  $('bandList').innerHTML = creative.bands.map((b, i, all) => {
    const last = i === all.length - 1;
    return `<div class="card">${cardHead('bands', i, all.length, t('band.n', i + 1))}<div class="grid2">` +
      `<label>${esc(t('band.shape'))}<select data-list="bands" data-i="${i}" data-k="shape">${shapeOpts(b.shape)}</select></label>` +
      (last ? `<label>${esc(t('band.height'))}<input type="text" value="${esc(t('band.rest'))}" disabled></label>`
            : numField('bands', i, 'height', t('band.height'), b.height, 'min="0" step="1"')) +
      numField('bands', i, 'slotW', t('band.w'), b.slotW, `min="0" step="0.1" placeholder="${fmt(p.slotW)}"`) +
      numField('bands', i, 'slotH', t('band.l'), b.slotH, `min="0.5" step="0.5" placeholder="${fmt(p.slotH)}"`) +
      `</div></div>`;
  }).join('');

  $('modList').innerHTML = creative.mods.map((m, i, all) => {
    let h = `<div class="card">${cardHead('mods', i, all.length, `${t('mod.n', i + 1)} · ${t('tg.' + m.target)}`)}<div class="grid2">`;
    h += `<label>${esc(t('mod.target'))}<select data-list="mods" data-i="${i}" data-k="target" data-rebuild>${MOD_TARGETS.map(k => opt(k, t('tg.' + k), m.target)).join('')}</select></label>`;
    h += `<label>${esc(t('mod.source'))}<select data-list="mods" data-i="${i}" data-k="source" data-rebuild>${MOD_SOURCES.map(k => opt(k, t('src.' + k), m.source)).join('')}</select></label>`;
    if (m.target === 'slotW' || m.target === 'slotH') {
      h += numField('mods', i, 'from', t('mod.from'), m.from, 'step="0.1"') + numField('mods', i, 'to', t('mod.to'), m.to, 'step="0.1"');
      h += numField('mods', i, 'strength', t('mod.strength'), m.strength, 'min="0" max="100" step="5"');
    } else {
      if (m.target === 'shape') h += `<label>${esc(t('mod.shapeB'))}<select data-list="mods" data-i="${i}" data-k="shapeB">${shapeOpts(m.shapeB)}</select></label>`;
      h += numField('mods', i, 'threshold', t('mod.threshold'), m.threshold, 'min="0" max="100" step="5"');
    }
    h += `<label class="check" style="align-self:end"><input type="checkbox" data-list="mods" data-i="${i}" data-k="invert"${m.invert ? ' checked' : ''}> ${esc(t('mod.invert'))}</label>`;
    h += '</div><div class="grid2" style="margin-top:6px">';
    if (m.source === 'linear') {
      h += numField('mods', i, 'angle', t('mod.angle'), m.angle, 'step="15"');
      h += `<label class="check" style="align-self:end"><input type="checkbox" data-list="mods" data-i="${i}" data-k="mirror"${m.mirror ? ' checked' : ''}> ${esc(t('mod.mirror'))}</label>`;
      h += `<div class="desc span2">${esc(t('mod.angleHint'))}</div>`;
    } else if (m.source === 'radial') {
      h += numField('mods', i, 'cx', t('mod.cx'), m.cx, 'step="5"') + numField('mods', i, 'cy', t('mod.cy'), m.cy, 'step="5"');
      h += numField('mods', i, 'radius', t('mod.radius'), m.radius, 'min="1" step="5"');
    } else if (m.source === 'wave') {
      h += numField('mods', i, 'angle', t('mod.angle'), m.angle, 'step="15"') + numField('mods', i, 'period', t('mod.period'), m.period, 'min="1" step="5"');
      h += numField('mods', i, 'phase', t('mod.phase'), m.phase, 'step="15"');
      h += `<div class="desc span2">${esc(t('mod.angleHint'))}</div>`;
    } else if (m.source === 'noise') {
      h += numField('mods', i, 'scale', t('mod.scale'), m.scale, 'min="1" step="5"') + numField('mods', i, 'seed', t('mod.seed'), m.seed, 'step="1"');
    } else if (m.source === 'image') {
      h += `<div class="imgrow span2">${m.img ? `<img src="${m.img.url}" alt="">` : ''}<span>${esc(m.img ? m.img.name : t('mod.noImage'))}</span>` +

}

function creativeInput(e) {
  const el = e.target, list = el.dataset.list;
  if (!list || !el.dataset.k) return;
  const item = creative[list][+el.dataset.i], k = el.dataset.k;
  if (el.type === 'checkbox') item[k] = el.checked;
  else if (el.type === 'number') item[k] = el.value === '' ? null : parseFloat(el.value);
  else item[k] = el.value;
  // waves along the height barely show between the rows; start them across the circumference
  if (k === 'source' && item.source === 'wave' && item.angle === 90) item.angle = 0;
  if (el.hasAttribute('data-rebuild')) renderCreativeUI();

}
let imgTarget = null;
function creativeClick(e) {
  const b = e.target.closest('button[data-act]');

  const list = creative[b.dataset.list], i = +b.dataset.i;
  if (b.dataset.act === 'img') { imgTarget = list[i]; $('imgFile').click(); return; }

// Downscale to ≤ 200 px greyscale JPEG so it can be stored with the parameters.
function loadImage(file) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 200 / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(2, Math.round(im.width * s)); cv.height = Math.max(2, Math.round(im.height * s));
      const g = cv.getContext('2d');
      g.filter = 'grayscale(1)';
      g.drawImage(im, 0, 0, cv.width, cv.height);
      if (imgTarget) imgTarget.img = { name: file.name, url: cv.toDataURL('image/jpeg', 0.85) };
      renderCreativeUI();
      render();
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

// ---------------------------------------------------------------- preview
const view = $('view'), stage = $('stage');
let zoom = 1, panX = 0, panY = 0, last = null;
let viewMode = '2d', legacyView = null;
try { viewMode = localStorage.getItem('kerf-view') || '2d'; } catch (e) {}
if (viewMode !== '3d') { legacyView = viewMode; viewMode = '2d'; }   // cut / light / flex from older versions
document.querySelector(`input[name=view][value="${viewMode}"]`).checked = true;

function previewInner(p, doc, vm) {
  const boards = doc.boards.map(b => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`).join('');
  if (vm === 'light') {
    const all = doc.cuts.join('');
    return `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter></defs>` +
      `<g fill="#231d19">${boards}</g>` +
      `<g fill="#ff9d2e" stroke="#ff9d2e" stroke-width="0.6" filter="url(#glow)">${all}</g>` +
      `<g fill="#ffe7b0" stroke="#ffe7b0" stroke-width="0.2">${all}</g>`;
  }
  if (vm === 'flex') {
    const dMid = bendDiameter(p), mat = MATERIALS[p.material];
    return `<g class="boards" fill="var(--board)" stroke="var(--muted)" stroke-width="1">${boards}</g>` +
      `<g stroke="#00000066" stroke-width="0.15">${doc.recs.map(r => `<g fill="${heatColor(r, dMid, mat)}">${r.els.join('')}</g>`).join('')}</g>`;
  }
  return `<g class="boards" fill="var(--board)" stroke="${p.border || p.mode === 'test' ? 'var(--cut)' : 'var(--muted)'}" stroke-width="1">${boards}</g>` +
    `<g class="cuts" fill="none" stroke="var(--cut)" stroke-width="1.2">${doc.cuts.join('')}</g>` +
    `<g fill="var(--engrave)" font-family="Arial, Helvetica, sans-serif" font-size="3">${doc.labels.join('')}</g>`;
}

function render() {
  const p = readParams();
  document.querySelectorAll('[data-modes]').forEach(el => { el.hidden = !el.dataset.modes.split(' ').includes(p.mode); });
  $('shapeDesc').textContent = t('desc.' + p.shape);
  $('meanderNote').hidden = !(p.mode === 'creative' && SHAPES[p.shape].meander);
  $('offset').disabled = p.offsetMode !== 'custom';
  if (p.offsetMode !== 'custom') $('offset').value = effectiveOffset(p, p.mode === 'test' ? p.testH : p.boardH);
  const dm = midDiameter(p);
  $('diaSummary').textContent = p.boardW > 0 ? t('diaSummary', (dm - p.thick).toFixed(2), dm.toFixed(2), (dm + p.thick).toFixed(2)) : '';
  try { localStorage.setItem('kerf-params', JSON.stringify(p)); } catch (e) {}

  const doc = buildDoc(p);
  last = { p, doc };
  if (!doc.count && p.mode !== 'test') {
    stage.innerHTML = '';
    $('info').textContent = t('info.none');
    $('flexInfo').innerHTML = '';
    return;
  }
  // 2D/3D plus an overlay: lamp light or flex heatmap
  const test = p.mode === 'test', ov = test ? null : view3d.overlay;
  const is3d = !test && viewMode === '3d';
  const vm = is3d ? '3d' : ov === 'light' ? 'light' : ov === 'flex' ? 'flex' : 'cut';
  view.classList.toggle('dark', ov === 'light');
  view.classList.toggle('is3d', is3d);
  $('three').hidden = !is3d;
  $('bendCtl').hidden = test;
  $('bendVal').textContent = view3d.bend + ' %';
  $('overlayCtl').hidden = test;
  stage.hidden = is3d;
  $('zLabel').hidden = $('zIn').hidden = $('zOut').hidden = is3d;
  $('hint').textContent = t(is3d ? 'hint3d' : 'hint');
  renderInfo(p, doc);
  if (is3d) { show3d(p, doc); return; }
  const [W, H] = outerSize(doc);
  stage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f(W)} ${f(H)}"><g${rotTransform(doc)}>${previewInner(p, doc, vm)}</g></svg>`;
  layout();
}

// ---------------------------------------------------------------- 3D preview
// three.js is loaded on first use. The board is built with its real
// thickness – outer and inner surface (cut pattern as alpha mask), a wall
// along every slot outline, top/bottom rims and side edges – and bent around
// the vertical axis (bend 100 % = closed cylinder). Bending is radial, so
// both surfaces and the slot walls stay aligned like in the real part.
const THREE_BASE = 'https://cdn.jsdelivr.net/npm/three@0.147.0/';
const MAT_COLORS = { pmma: 0xf3efe6, petg: 0xe6ecef, plywood: 0xd8b98a, mdf: 0xa98563 };
// plastics are shown semi-transparent (the far side shows through), wood is opaque
const MAT_OPACITY = { pmma: 0.6, petg: 0.7 };
const SEG_X = 360;   // segments around the circumference
let three = null, threeLoading = null, buildToken = 0, buildTimer = null;
let view3d = { bend: 100, overlay: null };
try {
  const saved = JSON.parse(localStorage.getItem('kerf-3d')) || {};
  if (!('overlay' in saved)) saved.overlay = legacyView === 'flex' ? 'flex' : saved.lamp || legacyView === 'light' ? 'light' : null;
  delete saved.lamp;
  Object.assign(view3d, saved);
} catch (e) {}
$('bend').value = view3d.bend;
$('lampOn').checked = view3d.overlay === 'light';
$('flexOn').checked = view3d.overlay === 'flex';

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = rej;
    document.head.append(el);
  });
}
function ensureThree() {
  if (!threeLoading) threeLoading = (async () => {
    await loadScript(THREE_BASE + 'build/three.min.js');
    await loadScript(THREE_BASE + 'examples/js/controls/OrbitControls.js');
    initThree();
  })();
  return threeLoading;
}
function initThree() {
  const el = $('three');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  el.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 20000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const hemi = new THREE.HemisphereLight(0xffffff, 0x555555, 0.9);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(0.6, 1, 1.4);
  const lamp = new THREE.PointLight(0xffb45e, 2.4, 0, 1);
  const shellMat = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, alphaTest: 0.5, roughness: 0.55, metalness: 0 });
  const wallMat = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.55, metalness: 0 });
  // lamp glow: slots light up (additive), drawn just outside the outer surface
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xd98a32, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 });
  const group = new THREE.Group();
  scene.add(hemi, dir, lamp, group);
  three = { renderer, scene, camera, controls, hemi, dir, lamp, shellMat, wallMat, glowMat, group, parts: [], size: '', outer: null, glow: null };
  new ResizeObserver(resize3d).observe(el);
  resize3d();
  (function loop() {
    requestAnimationFrame(loop);
    if (!el.hidden) { controls.update(); renderer.render(scene, camera); }
  })();
}
function resize3d() {
  if (!three) return;
  const r = $('three').getBoundingClientRect();
  if (!r.width || !r.height) return;
  three.renderer.setSize(r.width, r.height, false);
  three.camera.aspect = r.width / r.height;
  three.camera.updateProjectionMatrix();
}

// A part keeps its unbent coordinates as (x, y, d): x along the width
// (centred), y up, d across the thickness (+ = outside). bendParts() maps
// them onto the current bend.
function makePart(flat, uv, index, material, colors) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(flat.length), 3));
  if (uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uv), 2));
  if (colors) g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
  if (index) g.setIndex(index);
  const mesh = new THREE.Mesh(g, material);
  three.group.add(mesh);
  const part = { mesh, flat: new Float32Array(flat) };
  three.parts.push(part);
  return part;
}
// Strip along the width at height y (or two heights) – used for both surfaces and the rims.
function stripPart(W, y0, y1, d0, d1, v0, v1, material) {
  const flat = [], uv = [], index = [];
  for (let i = 0; i <= SEG_X; i++) {
    const x = -W / 2 + W * i / SEG_X, u = i / SEG_X;
    flat.push(x, y0, d0, x, y1, d1);
    uv.push(u, v0, u, v1);
    if (i < SEG_X) { const a = i * 2; index.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  return makePart(flat, uv, index, material);
}
// Walls along every slot outline, sampled from the cut paths. Each wall also
// gets its slot's heat colour (used by the flex overlay).
function wallFlat(p, doc) {
  const W = doc.w, H = doc.h, a = -p.thick / 2, b = p.thick / 2, out = [], cols = [];
  const dMid = bendDiameter(p), mat = MATERIALS[p.material], c = new THREE.Color();
  const items = doc.recs.length ? doc.recs : doc.cuts.map(src => ({ els: [src] }));
  for (const rec of items) {
    c.set(rec.kf !== undefined || rec.rigid ? heatColor(rec, dMid, mat) : HEAT.none);
    sampler.innerHTML = rec.els.join('');
    for (const el of sampler.children) {
      const len = el.getTotalLength();
      if (!(len > 0)) continue;
      const closed = /^(rect|ellipse|polygon|circle)$/.test(el.tagName) || /z\s*$/i.test(el.getAttribute('d') || '');
      const n = clamp(Math.ceil(len / 0.5), 6, 200);
      const pts = [];
      for (let i = 0; i <= n; i++) {
        if (closed && i === n) { pts.push(pts[0]); break; }
        const q = el.getPointAtLength(len * i / n);
        pts.push([q.x - W / 2, H / 2 - q.y]);
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        out.push(x0, y0, a, x0, y0, b, x1, y1, b, x0, y0, a, x1, y1, b, x1, y1, a);
        for (let k = 0; k < 6; k++) cols.push(c.r, c.g, c.b);
      }
    }
  }
  return { out, cols };
}
function buildParts(p, doc) {
  const th = p.thick;
  for (const prt of three.parts) { prt.mesh.geometry.dispose(); three.group.remove(prt.mesh); }
  three.parts = [];
  const W = doc.w, H = doc.h, t2 = Math.max(0.01, th / 2);
  three.outer = stripPart(W, -H / 2, H / 2, t2, t2, 0, 1, three.shellMat);
  stripPart(W, -H / 2, H / 2, -t2, -t2, 0, 1, three.shellMat);
  stripPart(W, H / 2, H / 2, -t2, t2, 1, 1, three.shellMat);      // top rim: mask's top row
  stripPart(W, -H / 2, -H / 2, -t2, t2, 0, 0, three.shellMat);    // bottom rim
  for (const sx of [-1, 1]) {                                     // side edges
    const x = sx * W / 2, u = sx < 0 ? 0 : 1;
    makePart([x, -H / 2, -t2, x, H / 2, -t2, x, -H / 2, t2, x, H / 2, t2], [u, 0, u, 1, u, 0, u, 1], [0, 2, 1, 1, 2, 3], three.shellMat);
  }
  const walls = wallFlat(p, doc);
  if (walls.out.length) makePart(walls.out, null, null, three.wallMat, walls.cols);
  three.glow = stripPart(W, -H / 2, H / 2, t2 + 0.05, t2 + 0.05, 0, 1, three.glowMat);
}
// Returns the cylinder axis position (z) for the lamp.
function bendParts(W, bend) {
  const theta = bend * 2 * Math.PI, R = theta > 1e-4 ? W / theta : 0;
  for (const prt of three.parts) {
    const pos = prt.mesh.geometry.attributes.position, fl = prt.flat;
    for (let i = 0, j = 0; i < pos.count; i++, j += 3) {
      const x = fl[j], y = fl[j + 1], d = fl[j + 2];
      if (R) {
        const phi = x / R, r = R + d;
        pos.setXYZ(i, r * Math.sin(phi), y, r * Math.cos(phi) - R);
      } else pos.setXYZ(i, x, y, d);
    }
    pos.needsUpdate = true;
    prt.mesh.geometry.computeVertexNormals();
    prt.mesh.geometry.computeBoundingSphere();
  }
  return R ? -R : null;
}
function styleMaterial(m, p, lampOn, masked, flexOn) {
  // the heatmap is shown on an opaque, white-lit surface so the colours read true
  const op = flexOn ? 1 : MAT_OPACITY[p.material] ?? 1;
  if (m.transparent !== op < 1) m.needsUpdate = true;
  if (masked) {
    const map = flexOn ? three.heatTex : null;
    if (m.map !== map) { m.map = map; m.needsUpdate = true; }
  } else if (m.vertexColors !== flexOn) { m.vertexColors = flexOn; m.needsUpdate = true; }
  m.color.setHex(flexOn ? 0xffffff : MAT_COLORS[p.material] || 0xeeeeee);
  m.transparent = op < 1;
  m.opacity = op;
  if (masked) m.alphaTest = op / 2;   // the mask is multiplied by opacity before the test
  m.depthWrite = op >= 1;
  m.roughness = op < 1 ? 0.25 : 0.55;
  m.emissive.setHex(lampOn && p.material === 'pmma' ? 0x3a2410 : 0x000000);
}
function apply3dScene(p, doc, refit) {
  if (!three.parts.length) return;
  const W = doc.w, H = doc.h, lampOn = view3d.overlay === 'light', flexOn = view3d.overlay === 'flex';
  $('bendVal').textContent = view3d.bend + ' %';
  const axis = bendParts(W, view3d.bend / 100);
  const axisZ = axis == null ? -H : Math.max(axis, -Math.max(W, H));
  three.scene.background = new THREE.Color(lampOn ? 0x0f0d0c : 0x1a181b);
  three.hemi.intensity = lampOn ? 0.22 : 0.9;
  three.dir.intensity = lampOn ? 0.08 : 0.6;
  three.lamp.intensity = lampOn ? 2.4 : 0;
  three.lamp.position.set(0, 0, axisZ);
  three.glow.mesh.visible = lampOn && !!three.glowMat.map;
  styleMaterial(three.shellMat, p, lampOn, true, flexOn);
  styleMaterial(three.wallMat, p, lampOn, false, flexOn);
  const size = `${W}x${H}`;
  if (refit || three.size !== size) {
    // fit to the bent shape's actual extent
    three.size = size;
    const g = three.outer.mesh.geometry;
    g.computeBoundingBox();
    const bb = g.boundingBox, cz = (bb.min.z + bb.max.z) / 2;
    const tanV = Math.tan(three.camera.fov * Math.PI / 360);
    const fitV = (H / 2) / tanV, fitH = ((bb.max.x - bb.min.x) / 2) / (tanV * three.camera.aspect);
    const d = Math.max(fitV, fitH) * 1.25 + (bb.max.z - cz);   // measured from the front-most surface
    three.controls.target.set(0, 0, cz);
    three.camera.position.set(d * 0.25, H * 0.25, cz + d);
    three.camera.near = d / 100; three.camera.far = d * 20;
    three.camera.updateProjectionMatrix();
  }
}
// Rasterise the cuts (black on white) into the alpha mask (≤ 4096 px) and
// derive the glow map (slots white on black, a soft halo plus the sharp slot).
function buildMasks(doc) {
  return new Promise(resolve => {
    const W = doc.w, H = doc.h, s = Math.min(10, 4096 / W, 4096 / H);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * s)}" height="${Math.round(H * s)}" viewBox="0 0 ${W} ${H}">` +
      `<rect width="${W}" height="${H}" fill="#fff"/><g fill="#000" stroke="#000" stroke-width="0.25">${doc.cuts.join('')}</g></svg>`;
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const cv = document.createElement('canvas');
      cv.width = im.width; cv.height = im.height;
      cv.getContext('2d').drawImage(im, 0, 0);
      const inv = document.createElement('canvas');
      inv.width = cv.width; inv.height = cv.height;
      const ig = inv.getContext('2d');
      ig.drawImage(cv, 0, 0);
      ig.globalCompositeOperation = 'difference';
      ig.fillStyle = '#fff';
      ig.fillRect(0, 0, inv.width, inv.height);
      const gc = document.createElement('canvas');
      gc.width = cv.width; gc.height = cv.height;
      const g = gc.getContext('2d');
      g.fillStyle = '#000';
      g.fillRect(0, 0, gc.width, gc.height);
      g.globalCompositeOperation = 'lighter';
      g.filter = `blur(${Math.max(1.5, s * 0.45)}px)`;
      g.globalAlpha = 0.45;
      g.drawImage(inv, 0, 0);
      g.filter = 'none';
      g.globalAlpha = 0.85;
      g.drawImage(inv, 0, 0);
      resolve({ mask: cv, glow: gc });
    };
    im.src = url;
  });
}
function setTexture(mat, key, canvas) {
  if (mat[key]) mat[key].dispose();
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = three.renderer.capabilities.getMaxAnisotropy();
  mat[key] = tex;
  mat.needsUpdate = true;
}
function buildHeat(p, doc) {
  return new Promise(resolve => {
    const W = doc.w, H = doc.h, s = Math.min(6, 2048 / W, 2048 / H);
    const dMid = bendDiameter(p), mat = MATERIALS[p.material], halo = Math.max(0.6, p.gapX);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * s)}" height="${Math.round(H * s)}" viewBox="0 0 ${W} ${H}">` +
      `<rect width="${W}" height="${H}" fill="#d9d4ca"/>` +
      doc.recs.map(r => { const c = heatColor(r, dMid, mat); return `<g fill="${c}" stroke="${c}" stroke-width="${halo}" stroke-linejoin="round">${r.els.join('')}</g>`; }).join('') +
      `</svg>`;
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const cv = document.createElement('canvas');
      cv.width = im.width; cv.height = im.height;
      cv.getContext('2d').drawImage(im, 0, 0);
      resolve(cv);
    };
    im.src = url;
  });
}
async function rebuild3d(p, doc) {
  const token = ++buildToken;
  const [masks, heat] = await Promise.all([buildMasks(doc), buildHeat(p, doc)]);
  if (token !== buildToken) return;
  buildParts(p, doc);
  setTexture(three.shellMat, 'alphaMap', masks.mask);
  setTexture(three.glowMat, 'map', masks.glow);
  if (three.heatTex) three.heatTex.dispose();
  three.heatTex = new THREE.CanvasTexture(heat);
  if (three.shellMat.map) { three.shellMat.map = null; three.shellMat.needsUpdate = true; }
  apply3dScene(p, doc, false);
}
function show3d(p, doc) {
  $('threeMsg').textContent = three ? '' : t('three.loading');
  ensureThree().then(() => {
    $('threeMsg').textContent = '';
    resize3d();
    apply3dScene(p, doc, false);
    clearTimeout(buildTimer);
    buildTimer = setTimeout(() => rebuild3d(p, doc), 150);
  }).catch(() => { $('threeMsg').textContent = t('three.fail'); threeLoading = null; });
}
function save3d() { try { localStorage.setItem('kerf-3d', JSON.stringify(view3d)); } catch (e) {} }
let bendFrame = 0, heatTimer = null;
$('bend').addEventListener('input', () => {
  view3d.bend = +$('bend').value; save3d(); updateSaveLabel();
  $('bendVal').textContent = view3d.bend + ' %';
  if (!last) return;
  if (view.classList.contains('is3d')) {
    if (three) apply3dScene(last.p, last.doc, false);
    renderInfo(last.p, last.doc);
    // the 3D heatmap colours depend on the bend: rebuild them once the slider rests
    if (view3d.overlay === 'flex' && three) { clearTimeout(heatTimer); heatTimer = setTimeout(() => rebuild3d(last.p, last.doc), 200); }
  } else if (!bendFrame) {
    bendFrame = requestAnimationFrame(() => { bendFrame = 0; render(); });
  }
});
// light and flex are exclusive overlays
function setOverlay(ov) {
  view3d.overlay = ov;
  $('lampOn').checked = ov === 'light';
  $('flexOn').checked = ov === 'flex';
  save3d();
  if (view.classList.contains('is3d') && three && last) { apply3dScene(last.p, last.doc, false); renderInfo(last.p, last.doc); }

function layout() {
  if (!last || !stage.firstChild) return;
  const [W, H] = outerSize(last.doc);
  const r = view.getBoundingClientRect(), m = 30;
  const base = Math.max(0.01, Math.min((r.width - 2 * m) / W, (r.height - 2 * m - 30) / H));
  const s = base * zoom;
  const svg = stage.firstChild;
  svg.setAttribute('width', W * s);
  svg.setAttribute('height', H * s);
  const x = (r.width - W * s) / 2 + panX, y = (r.height - H * s) / 2 + 12 + panY;
  stage.style.transform = `translate(${x}px, ${y}px)`;
  $('zLabel').textContent = Math.round(zoom * 100) + '%';
}

function setZoom(z, cx, cy) {
  const r = view.getBoundingClientRect();
  if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
  const nz = Math.max(0.1, Math.min(40, z));
  // keep the point under the cursor fixed
  const ox = cx - r.width / 2 - panX, oy = cy - r.height / 2 - panY;
  panX -= ox * (nz / zoom - 1);
  panY -= oy * (nz / zoom - 1);
  zoom = nz;
  layout();
}

// Texture: a seamless tile of the base pattern (bands and modulators are left
// out – they are not periodic). The pattern repeats every 2 columns across and
// every row pitch down; the tile uses the whole multiples that come closest to
// a square and is stretched slightly onto the square image.
const fmt3 = v => String(+v.toFixed(2));
function buildTile(p) {
  const stepX = (SHAPES[p.shape].line ? 0 : p.slotW) + p.gapX, stepY = p.slotH + p.gapY;
  let best = null;
  for (let m = 1; m <= 40; m++) for (let k = 1; k <= 40; k++) {
    const w = 2 * m * stepX, h = k * stepY, err = Math.abs(w / h - 1);
    if (w > 600 || h > 600) continue;
    if (!best || err < best.err - 1e-9) best = { w, h, err };
    if (err < 0.01) break;
  }
  const { w, h } = best;
  const q = { ...p, mode: 'pattern', shape: SHAPES[p.shape].meander ? 'Pill' : p.shape, seamless: false,
              openEdges: true, offsetMode: 'top', offset: 0, marginX: 0, boardW: w + 1e-6, boardH: h };
  const gen = generate(q, q.boardW, h, 0, q.boardW);
  const cuts = gen ? gen.columns.flat().flatMap(r => r.els) : [];
  const N = 2048;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${N}" height="${N}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">` +
    `<rect width="${w}" height="${h}" fill="#fff"/><g fill="#000" stroke="#000" stroke-width="${KERF}">${cuts.join('')}</g></svg>`;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const cv = document.createElement('canvas');
      cv.width = cv.height = N;
      cv.getContext('2d').drawImage(im, 0, 0, N, N);
      cv.toBlob(blob => blob ? resolve({ blob, w, h }) : reject(new Error('png')), 'image/png');
    };
    im.onerror = reject;
    im.src = url;
  });
}

// STL: the board as a closed solid. Board minus slots is computed with
// Clipper in narrow vertical strips (so the bent model stays round and the
// triangulation stays fast), each strip's faces are triangulated with earcut,
// walls follow every contour except the internal strip seams, and the result
// is bent radially like the 3D preview. Zero-width cuts (lines, chevrons)
// get the laser kerf as width.
const GEO_LIBS = ['https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js', 'https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js'];

function ensureGeoLibs() {

  return geoLoading;
}
// Slot outlines as integer polygons in y-up board coordinates.
function slotPolygons(doc) {
  const H = doc.h, S = STL_SCALE, polys = [], opens = [];
  for (const rec of doc.recs) {
    sampler.innerHTML = rec.els.join('');
    for (const el of sampler.children) {
      const len = el.getTotalLength();
      if (!(len > 0)) continue;
      const open = el.tagName === 'line' || el.tagName === 'polyline';
      const notch = el.tagName === 'path' && !/z\s*$/i.test(el.getAttribute('d') || '');
      const n = clamp(Math.ceil(len / STL_STEP), 8, 800);
      const pts = [];
      for (let i = 0; i < n + (open || notch ? 1 : 0); i++) {
        const q = el.getPointAtLength(len * i / n);
        pts.push({ X: Math.round(q.x * S), Y: Math.round((H - q.y) * S) });
      }
      if (notch) {
        // paths cut open at the board edge start and end on that edge; extend both ends
        // 1 mm past the edge so the notch cuts through cleanly instead of leaving a sliver
        const out = q => ({ X: q.X, Y: q.Y <= H * S / 2 ? -S : Math.round(H * S) + S });
        pts.push(out(pts[pts.length - 1]));
        pts.unshift(out(pts[0]));

      (open ? opens : polys).push(pts);
    }
  }
  if (opens.length) {
    const co = new ClipperLib.ClipperOffset();
    co.AddPaths(opens, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etOpenRound);
    const sol = new ClipperLib.Paths();
    co.Execute(sol, KERF / 2 * S);

  const merged = new ClipperLib.Paths();
  un.Execute(ClipperLib.ClipType.ctUnion, merged, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);

    let minX = Infinity, maxX = -Infinity;

    for (const h of holes) if (h.maxX > X0 && h.minX < X1) cl.AddPath(h.p, ClipperLib.PolyType.ptClip, true);

  const out = new Float32Array(tris.length);
  for (let k = 0; k < tris.length; k += 9) {
    out.set(map(tris[k], tris[k + 1], tris[k + 2]), k);
    out.set(map(tris[k + 6], tris[k + 7], tris[k + 8]), k + 3);
    out.set(map(tris[k + 3], tris[k + 4], tris[k + 5]), k + 6);

}

    let i = idx.get(k);
    if (i === undefined) { i = verts.length + 1; idx.set(k, i); verts.push(`v ${f(tris[j])} ${f(tris[j + 1])} ${f(tris[j + 2])}`); }

  // reload once; never loop if the defaults fail as well
  let retried = false;
  try { retried = sessionStorage.getItem('kerf-reset') === '1'; sessionStorage.setItem('kerf-reset', '1'); } catch (err) { retried = true; }
  if (!retried) location.reload(); else throw e;
}
</script>
